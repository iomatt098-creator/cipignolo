<style>
:root{
  --bg:#FFE8EF; --accent:#EC6F9A; --ink:#A8305C; --piggy:#F28DAF;
  --text:#3B2430; --text2:#5E4652; --muted:#6B5560; --card:#FFFFFF;
  --line:#F3DCE4; --warn:#B4541A; --warnbar:#F4A261; --warnbg:#FFF1E4;
  --good:#1E6B40; --goodbg:#E3F4E9; --gold:#F2C14E; --goldline:#C9901A;
  --shadow:0 4px 14px rgba(59,36,48,.08);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;transition:background .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.brand{font-family:var(--head);font-weight:700;font-size:26px;color:var(--ink)}
.icons{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(59,36,48,.1);flex:none}
.ibtn svg{width:22px;height:22px}
h1.t{font-family:var(--head);font-weight:700;font-size:30px;color:var(--ink);margin:6px 0 2px}

.sub{color:var(--text2);font-weight:600;font-size:15px;margin:0}
.card{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.center{text-align:center}
.small{font-size:13px;font-weight:600;color:var(--muted)}
.label{font-size:14px;font-weight:700;color:var(--text2)}

.bar{height:12px;border-radius:6px;background:rgba(59,36,48,.1);overflow:hidden}

.deco{position:absolute;pointer-events:none}
.coin{width:28px;height:28px;border-radius:50%;background:var(--gold);border:3px solid var(--goldline);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:14px;color:#7A4F00}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qbtn{min-height:80px;border:0;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 8px rgba(59,36,48,.08);padding:8px 4px;text-align:center}

.ring{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

.item{width:100%;min-height:56px;border:0;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left}

.item .grow{flex:1;min-width:0;display:flex;flex-direction:column}

.dot{width:38px;height:38px;border-radius:19px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:15px;color:var(--text)}
.amt{font-family:var(--head);font-weight:600;font-size:17px;white-space:nowrap}
.tip{background:#FFF5DC;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin:12px 0}

.tip.warn{background:var(--warnbg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:27px;background:var(--accent);color:var(--text);font-family:var(--head);font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(59,36,48,.12);margin-top:12px;padding:0 18px}
.btn.ghost{background:var(--card);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.btn.line{background:transparent;box-shadow:none;border:2px dashed var(--accent);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;min-height:48px}
.btn.danger{background:var(--warnbg);color:var(--warn);font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;box-shadow:none}
.link{border:0;background:none;color:var(--ink);font-weight:800;text-decoration:underline;font-size:16px;min-height:44px;padding:0 6px}

label.f{display:block;font-size:14px;font-weight:800;color:var(--text2);margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;min-height:52px;border:2px solid transparent;border-radius:16px;background:var(--bg);padding:0 14px;font-size:17px;font-weight:700}

.money{display:flex;align-items:center;background:var(--card);border-radius:20px;height:70px;padding:0 20px;box-shadow:0 2px 8px rgba(59,36,48,.08)}
.money input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--head);font-weight:700;font-size:34px;outline:0}
.money span{font-family:var(--head);font-weight:700;font-size:30px;color:var(--ink)}
.sheet .money{background:var(--bg);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--accent);background:var(--card);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.chip.on{background:var(--piggy)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{min-height:64px;border-radius:20px;border:2px solid transparent;background:var(--card);font-weight:800;font-size:16px;padding:10px;box-shadow:0 2px 8px rgba(59,36,48,.08)}
.opt.on{border-color:var(--accent);background:var(--piggy)}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:0 2px 6px rgba(59,36,48,.06);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.check .grow{flex:1;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -4px 16px rgba(59,36,48,.08);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{min-height:54px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-weight:700;font-size:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink);font-weight:800}
.levels{display:flex;flex-direction:column;gap:8px}
.lv{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.55);border-radius:18px;padding:10px 14px;min-height:56px;border:2px solid transparent}
.lv.here{background:var(--card);border-color:var(--accent)}
.lv .n{width:36px;height:36px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:15px;border:3px solid}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{background:var(--card);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0}
.medal b{font-size:13px;font-weight:800;line-height:1.2}
.medal.off{opacity:.8}
.disc{font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin:18px 10px 0}
.backdrop{position:fixed;inset:0;background:rgba(59,36,48,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;cursor:pointer}
.sheet{position:relative;cursor:auto}
.sx{position:sticky;top:0;float:right;margin:-2px -6px 0 8px;z-index:2;background:var(--bg)!important;box-shadow:none!important}
.backdrop.show{opacity:1}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s}
.backdrop.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(59,36,48,.18);margin:4px auto 10px}
.sheet h3{font-family:var(--head);font-weight:600;font-size:24px;margin:4px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:12px 16px;border-radius:16px;font-weight:700;font-size:15px;z-index:30;opacity:0;transition:.2s;display:flex;align-items:center;gap:14px;max-width:92vw;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:#FFD1E0;font-weight:800;text-decoration:underline;min-height:32px;padding:0}
.ob{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(28px + env(safe-area-inset-bottom))}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.steps i{height:6px;border-radius:3px;background:rgba(59,36,48,.12)}
.steps i.on{background:var(--accent)}
.ob h1{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.2;margin:0}
.ob .push{margin-top:auto}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>

<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
(() => {
"use strict";

/* =========================================================
   CIPIGNOLO – fai contare i tuoi soldi
   App gratuita, senza server: i dati restano nel browser.
   Non è consulenza finanziaria.
   ========================================================= */

const KEY = "cipignolo-v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur0 = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", maximumFractionDigits:0, useGrouping:"always"});
const eur2 = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:"always"});
const fmt = n => eur0.format(Math.round(n || 0));
const fmt2 = n => eur2.format(n || 0);
const pct = n => Math.round(n) + "%";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((parse(iso(b)) - parse(iso(a))) / 864e5);
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MESI_B = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const num = v => { const s = String(v ?? "").trim().replace(/\s|€/g, ""); if (!s) return 0; const n = parseFloat(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s); return isFinite(n) ? n : 0; };
const numOrNull = v => String(v ?? "").trim() === "" ? null : num(v);
const sum = (a, f = x => x) => (a || []).reduce((t, x) => t + (+f(x) || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- livelli e colori ---------- */
const LEVELS = [
  { n:"Punto di partenza", d:"Sai dove vanno i tuoi soldi", bg:"#F4EFF1", accent:"#C9BCC2", ink:"#5E4652", piggy:"#CFC4C9", ghost:true },
  { n:"Respiro", d:"Il mese si chiude senza andare in rosso", bg:"#FFE8EF", accent:"#EC6F9A", ink:"#A8305C", piggy:"#F28DAF" },
  { n:"Cuscinetto", d:"Fondo pari a 1 mese di spese", bg:"#FFEDE5", accent:"#FF8A5C", ink:"#A3401C", piggy:"#FF9E7A" },
  { n:"Via i debiti cari", d:"Niente più debiti sopra il 10%", bg:"#F1EBFC", accent:"#9B7BE0", ink:"#5B3FA6", piggy:"#B69CE8" },
  { n:"Rate leggere", d:"Rate sotto il 15% delle entrate", bg:"#E4F6F9", accent:"#2FB3C9", ink:"#136D7D", piggy:"#5EC4D6" },
  { n:"Fondo pieno", d:"3 mesi di spese da parte", bg:"#E3F4E9", accent:"#2E9E5E", ink:"#1E6B40", piggy:"#3DAA6B" },
  { n:"Obiettivi", d:"Risparmi per qualcosa di tuo", bg:"#EEF1F4", accent:"#9AA6B2", ink:"#4A5563", piggy:"#C3CCD5" },
  { n:"Testa dura", d:"Tutto mantenuto per 6 mesi", bg:"#FFF0C9", accent:"#E8A90C", ink:"#8A5A00", piggy:"#F2C14E" }
];
const MSG = [
  "Benvenuto! Prima vediamo dove vanno i soldi.",
  "Un passo alla volta: stai andando bene.",
  "Il cuscinetto c'è. Ora tocca agli interessi.",
  "Addio interessi! Bel colpo.",
  "Rate leggere: si respira di più.",
  "Fondo pieno: gli imprevisti fanno meno paura.",
  "Testa dura! Manca pochissimo all'oro.",
  "Ce l'hai fatta. Che testa dura!"
];

/* ---------- categorie e tasti rapidi predefiniti ---------- */
const DEF_CATS = ["Spesa","Bar e colazioni","Sigarette","Benzina","Pranzi e cene","Salute","Svago","Varie"];
const RAPIDI_CATALOGO = [
  { nome:"Caffè", tipo:"fisso", prezzo:1.2, cat:"Bar e colazioni" },
  { nome:"Cornetto", tipo:"fisso", prezzo:1.0, cat:"Bar e colazioni" },
  { nome:"Colazione", tipo:"fisso", prezzo:3.0, cat:"Bar e colazioni" },
  { nome:"Sigarette", tipo:"chiedi", prezzo:null, cat:"Sigarette" },
  { nome:"Ricarica", tipo:"chiedi", prezzo:null, cat:"Varie" },
  { nome:"Parcheggio", tipo:"chiedi", prezzo:null, cat:"Varie" },
  { nome:"Spesa", tipo:"libero", prezzo:null, cat:"Spesa" },
  { nome:"Benzina", tipo:"libero", prezzo:null, cat:"Benzina" },
  { nome:"Pranzo fuori", tipo:"libero", prezzo:null, cat:"Pranzi e cene" },
  { nome:"Farmacia", tipo:"libero", prezzo:null, cat:"Salute" },
  { nome:"Animali", tipo:"libero", prezzo:null, cat:"Varie" },
  { nome:"Svago", tipo:"libero", prezzo:null, cat:"Svago" }
];
const CAT_TINT = ["#FFDCCB","#D7F0E0","#E7DEFA","#D3F0F5","#FFE1EA","#FFF1C7","#E3E8EE","#F6E3EA"];

const HABITS = [
  "Voglia di una sigaretta in più? Aspetta 5 minuti e bevi un bicchiere d'acqua.",
  "Voglia di comprare online? Metti nel carrello e aspetta 48 ore.",
  "Conta in ore di lavoro: dividi una spesa per quanto guadagni in un'ora.",
  "Il budget è un permesso, non un divieto.",
  "Festeggia i traguardi: un debito chiuso, un fondo pieno.",
  "Prelievo fisso il lunedì, controllo di 5 minuti la domenica."
];

/* ---------- stato ---------- */
function blank() {
  return {
    v:1, setup:false, setupAt:null, modo:"solo",
    entrate:{ tipo:"fisso", importo:0, importo2:0, giorno:23 },
    budgetMensile:null,
    fisse:[], debiti:[],
    fondo:{ saldo:0, prima:null },
    categorie:DEF_CATS.slice(),
    rapidi:[], spese:[], obiettivi:[], scadenze:[], extra:[],
    livello:{ max:0, date:{} },
    medaglie:{}, ultimoBackup:null
  };
}
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Non riesco a salvare sul telefono"); }
}

/* ---------- calcoli ---------- */
const entrate = () => (+S.entrate.importo || 0) + (S.modo === "coppia" ? (+S.entrate.importo2 || 0) : 0);
const fisseTot = () => sum(S.fisse, f => f.importo);
const debitiAttivi = () => S.debiti.filter(d => (+d.saldo || 0) > 0);
const rateTot = () => sum(debitiAttivi(), d => d.rata);
const rateNoMutuo = () => sum(debitiAttivi().filter(d => d.tipo !== "mutuo"), d => d.rata);
const budgetSuggerito = () => Math.max(0, Math.floor((entrate() - fisseTot() - rateTot()) * 0.9 / 5) * 5);
const budgetMese = () => S.budgetMensile == null ? budgetSuggerito() : +S.budgetMensile;
const budgetSett = () => budgetMese() * 12 / 52;
const speseMese = () => fisseTot() + rateTot() + budgetMese();
const avanzo = () => entrate() - speseMese();
const mesiTarget = () => S.entrate.tipo === "variabile" ? 6 : 3;
const fondoMesi = () => speseMese() > 0 ? S.fondo.saldo / speseMese() : 0;
const isCaro = d => d.tasso != null && d.tasso > 10 && d.saldo > 0;
const debitiCari = () => S.debiti.filter(isCaro);
const interessiMese = d => (d.saldo || 0) * (d.tasso || 0) / 1200;
const ordineDebiti = () => S.debiti.slice().sort((a, b) => {
  if ((a.saldo > 0) !== (b.saldo > 0)) return a.saldo > 0 ? -1 : 1;
  if ((a.tipo === "mutuo") !== (b.tipo === "mutuo")) return a.tipo === "mutuo" ? 1 : -1;
  return (b.tasso ?? -1) - (a.tasso ?? -1);
});
function mesiAllaChiusura(d) {
  const S0 = +d.saldo || 0, R = +d.rata || 0; if (S0 <= 0) return 0; if (R <= 0) return null;
  const r = (+d.tasso || 0) / 1200;
  if (r > 0) { if (R <= S0 * r) return Infinity; return Math.ceil(-Math.log(1 - r * S0 / R) / Math.log(1 + r)); }
  return Math.ceil(S0 / R);
}
function meseFra(n) { const d = today(); d.setDate(1); d.setMonth(d.getMonth() + n - 1); return `${MESI[d.getMonth()]} ${d.getFullYear()}`; }

const speseIn = (a, b) => { const A = iso(a), B = iso(b); return S.spese.filter(s => s.data >= A && s.data <= B); };
const settimana = off => { const s = addDays(weekStart(today()), off * 7); return { a:s, b:addDays(s, 6) }; };
const meseCorrente = () => { const d = today(); return { a:new Date(d.getFullYear(), d.getMonth(), 1), b:new Date(d.getFullYear(), d.getMonth() + 1, 0) }; };

/* criteri dei livelli: tutti quelli fino a k devono essere veri */
function criteri() {
  const e = entrate(), sm = speseMese();
  return [
    true,
    e > 0 && avanzo() >= 0,
    sm > 0 && S.fondo.saldo >= sm,
    debitiCari().length === 0 && S.debiti.every(d => !(d.saldo > 0 && d.tasso == null && d.tipo === "carta")),
    e > 0 && rateNoMutuo() <= e * 0.15,
    sm > 0 && S.fondo.saldo >= sm * mesiTarget(),
    S.obiettivi.some(o => (+o.saldo || 0) > 0),
    !!S.livello.date[6] && daysBetween(parse(S.livello.date[6]), today()) >= 180
  ];
}
function candidato() { const c = criteri(); let k = 0; for (let i = 1; i < c.length; i++) { if (c[i]) k = i; else break; } return k; }

function progresso(k) {
  const e = entrate(), sm = speseMese();
  switch (k) {
    case 1: { const m = -avanzo(); return { p: e > 0 ? clamp(e / sm * 100, 0, 99) : 0, h: m > 0 ? `Mancano ${fmt(m)} al mese per chiudere in pari` : "Ci sei quasi" }; }
    case 2: { const m = sm - S.fondo.saldo; return { p: clamp(S.fondo.saldo / sm * 100, 0, 100), h: `Ti mancano ${fmt(Math.max(0, m))} per il Cuscinetto` }; }
    case 3: { const c = debitiCari(); const tot = sum(c, d => d.saldo), ini = sum(c, d => d.saldoIniziale || d.saldo);
      const senza = S.debiti.find(d => d.saldo > 0 && d.tasso == null && d.tipo === "carta");
      if (!c.length && senza) return { p: 50, h: `Scrivi il tasso di ${senza.nome} per capire se è caro` };
      return { p: ini > 0 ? clamp((1 - tot / ini) * 100, 0, 100) : 0, h: c.length === 1 ? `${c[0].nome}: restano ${fmt(tot)}` : `Debiti cari: restano ${fmt(tot)}` }; }
    case 4: { const r = e > 0 ? rateNoMutuo() / e * 100 : 0; return { p: r > 0 ? clamp(15 / r * 100, 0, 100) : 100, h: `Rate al ${pct(r)}, obiettivo 15%` }; }
    case 5: { const m = fondoMesi(); return { p: clamp(m / mesiTarget() * 100, 0, 100), h: `Fondo a ${m.toFixed(1).replace(".", ",")} mesi su ${mesiTarget()}` }; }
    case 6: return { p: S.obiettivi.length ? 50 : 0, h: S.obiettivi.length ? "Metti qualcosa nel tuo obiettivo" : "Scegli il tuo primo obiettivo" };
    case 7: { const d = S.livello.date[6] ? daysBetween(parse(S.livello.date[6]), today()) : 0; return { p: clamp(d / 180 * 100, 0, 100), h: `Ancora ${Math.max(0, Math.ceil((180 - d) / 30))} mesi così e il Cipignolo è d'oro` }; }
    default: return { p: 100, h: "Cipignolo d'oro: mantieni il ritmo" };
  }
}

/* ---------- medaglie ---------- */
function settimanePassate() {
  if (!S.spese.length) return [];
  const first = S.spese.reduce((m, s) => s.data < m ? s.data : m, S.spese[0].data);
  const out = []; let w = weekStart(parse(first)); const cur = weekStart(today());
  while (w < cur) { const b = addDays(w, 6); const sp = speseIn(w, b); out.push({ a:w, spese:sp, tot:sum(sp, s => s.importo), attiva:sp.length > 0 }); w = addDays(w, 7); }
  return out;
}
function serieGiorni() {
  const days = [...new Set(S.spese.map(s => s.data))].sort(); let best = 0, run = 0, prev = null;
  days.forEach(d => { run = prev && daysBetween(parse(prev), parse(d)) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return best;
}

];
const sfidaDi = d => SFIDE[Math.floor(weekStart(d).getTime() / (7 * 864e5)) % SFIDE.length];

/* aggiorna livello e medaglie dopo ogni cambiamento */
function check(silent) {
  const t = iso(today()); const news = [];
  S.debiti.forEach(d => { if (isCaro(d)) d.eraCaro = true; });
  const c = candidato();
  if (c > S.livello.max) {
    for (let k = S.livello.max + 1; k <= c; k++) S.livello.date[k] = S.livello.date[k] || t;
    const from = S.livello.max; S.livello.max = c;
    if (!silent && S.setup) setTimeout(() => celebraLivello(c, from), 350);
  }
  MEDALS.forEach(m => { if (!S.medaglie[m.id] && m.ok()) { S.medaglie[m.id] = t; news.push(m.n); } });
  save();
  if (!silent && news.length && S.setup) setTimeout(() => toast(`Nuova medaglia: ${news.join(", ")}`), 900);
}
function livelloInPausa() { const c = candidato(); return c < S.livello.max ? c + 1 : 0; }

/* ---------- consigli (regole "se… allora…") ---------- */
function consigli() {
  const out = []; const e = entrate();
  const cari = debitiCari().sort((a, b) => b.tasso - a.tasso);
  if (e > 0 && (avanzo() < -e * 0.1 || rateNoMutuo() > e * 0.4))
    out.push({ k:"help", t:"Se i debiti sono diventati troppo pesanti non sei solo: uno sportello gratuito (associazioni dei consumatori, sportelli anti-usura) può aiutarti a trovare una strada." });
  if (cari.length) out.push({ k:"tip", t:`Chiudi prima ${esc(cari[0].nome)}: al ${String(cari[0].tasso).replace(".", ",")}% ti costa circa ${fmt(interessiMese(cari[0]))} di interessi al mese.` });
  const senza = S.debiti.find(d => d.saldo > 0 && d.tasso == null);
  if (senza) out.push({ k:"tip", t:`Sai il tasso di ${esc(senza.nome)}? Ci aiuta a capire quale debito chiudere prima. Lo trovi nell'estratto conto o nel contratto.` });
  if (speseMese() > 0 && fondoMesi() < 1) out.push({ k:"tip", t:`Prima priorità: un fondo pari a 1 mese di spese, cioè ${fmt(speseMese())}.` });
  const m = meseCorrente(); const sp = speseIn(m.a, m.b); const tot = sum(sp, s => s.importo);
  if (tot >= 50) {
    const by = {}; sp.forEach(s => by[s.cat] = (by[s.cat] || 0) + s.importo);
    const [cat, v] = Object.entries(by).sort((a, b) => b[1] - a[1]).find(([c]) => !/^spesa$/i.test(c)) || [];
    if (cat && v / tot > 0.15) {
      if (/bar|colazion/i.test(cat)) out.push({ k:"tip", t:`Il bar pesa il ${pct(v / tot * 100)} delle spese di questo mese. Con 2 caffè al giorno invece di 4 risparmi circa ${fmt(2 * 1.2 * 30)} al mese.` });
      else out.push({ k:"tip", t:`${esc(cat)} pesa il ${pct(v / tot * 100)} delle spese di questo mese. Ridurla di un terzo vale circa ${fmt(v / 3)} al mese.` });
    }
  }
  const w = settimana(0); if (sum(speseIn(w.a, w.b), s => s.importo) > budgetSett() && budgetSett() > 0)
    out.push({ k:"warn", t:"Settimana storta, non piano rovinato: si riparte lunedì." });
  if (S.extra.some(x => !x.diviso && daysBetween(parse(x.data), today()) <= 30))
    out.push({ k:"tip", t:"È arrivato un extra: metà al piano, metà a te. Te lo sei meritato." });
  const p = S.debiti.find(d => d.tipo === "prestito" && d.saldo > 0 && d.saldo < 10000);
  if (p) out.push({ k:"tip", t:`${esc(p.nome)} è sotto i 10.000 €: valuta se chiuderlo in anticipo. Chiedi alla banca il conteggio di estinzione e le eventuali penali.` });
  if (debitiAttivi().some(d => d.tipo !== "mutuo" && d.rata > 0)) out.push({ k:"tip", t:"Evita nuove rate finché non chiudi quelle in corso." });
  return out;
}

/* ---------- UI di base ---------- */
let toastT;
function toast(msg, undo) {
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Annulla</button>' : ""}`;
  t.classList.add("show"); clearTimeout(toastT);
  if (undo) $("#undo").onclick = () => { undo(); t.classList.remove("show"); };
  toastT = setTimeout(() => t.classList.remove("show"), undo ? 4500 : 2600);
}
function sheet(html, mount) {
  closeSheet(true);
  const b = document.createElement("div"); b.className = "backdrop"; b.id = "bd";
  b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button type="button" class="ibtn sx" aria-label="Chiudi">${ico("plus", 2.4).replace("<svg", '<svg style="transform:rotate(45deg)"')}</button><div class="grab"></div>${html}</div>`;
  document.body.appendChild(b); requestAnimationFrame(() => b.classList.add("show"));
  b.addEventListener("click", e => { if (e.target === b || e.target.closest(".sx")) closeSheet(); });
  const sh = b.querySelector(".sheet"); let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive:true });
  sh.addEventListener("touchmove", e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; sh.style.transform = dy > 0 ? `translateY(${dy}px)` : ""; }, { passive:true });
  sh.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 90) closeSheet(); else sh.style.transform = ""; });
  document.addEventListener("keydown", escClose);
  mount && mount(b);
  const f = b.querySelector("input:not([type=checkbox]),select"); if (f) setTimeout(() => f.focus(), 60);
  return b;
}
function escClose(e) { if (e.key === "Escape") closeSheet(); }
function closeSheet(now) { const b = $("#bd"); document.removeEventListener("keydown", escClose); if (!b) return; if (now) { b.remove(); return; } b.classList.remove("show"); setTimeout(() => b.remove(), 200); }

      <h1 class="center" style="font-size:34px;color:var(--ink)">Cipignolo</h1>
      <p class="sub center" style="font-size:17px">fai contare i tuoi soldi</p>
      <div class="card"><p style="margin:0;font-weight:600">A Viterbo il salvadanaio si chiama cipignolo. Questo ti aiuta a capire dove vanno i soldi, uscire dai debiti cari e mettere da parte un fondo, un passo alla volta.</p>
      <p class="small" style="margin:10px 0 0">I tuoi dati restano solo su questo telefono. Cipignolo ti dà numeri e idee, ma non è consulenza finanziaria: le decisioni restano tue.</p></div>

    $("#go").onclick = () => { OB.step = 1; renderOB(); };
    $("#imp").onclick = importa;
    return;
  }
  const st = OB_STEPS[OB.step - 1];
  let body = "";
  if (st.kind === "modo") {
    body = `<div class="seg"><button class="opt ${OB.modo === "solo" ? "on" : ""}" data-modo="solo" aria-pressed="${OB.modo === "solo"}">Da solo</button><button class="opt ${OB.modo === "coppia" ? "on" : ""}" data-modo="coppia" aria-pressed="${OB.modo === "coppia"}">In coppia o famiglia</button></div>
      <p class="small">In coppia mettiamo insieme due stipendi e le spese comuni, tutto su questo telefono. Puoi cambiarlo quando vuoi.</p>`;
  } else if (st.kind === "money") {
    body = `${moneyField("v", OB[st.key], "Cifra al mese".replace(" al mese", st.key === "debiti" || st.key === "risparmi" ? "" : " al mese"))}
      <div class="chips">${st.chips.map(c => `<button class="chip ${num(OB[st.key]) === c && OB[st.key] !== "" ? "on" : ""}" data-chip="${c}">${c.toLocaleString("it-IT")}</button>`).join("")}</div>
      <p class="small center" style="margin-top:14px">Va bene anche a occhio, puoi correggere quando vuoi.</p>`;
  } else if (st.kind === "stipendio") {
    const two = OB.modo === "coppia";
    body = `<div class="seg"><button class="opt ${OB.fisso === true ? "on" : ""}" data-fisso="1" aria-pressed="${OB.fisso === true}">Sì, fisso</button><button class="opt ${OB.fisso === false ? "on" : ""}" data-fisso="0" aria-pressed="${OB.fisso === false}">No, cambia</button></div>
      <div class="${OB.fisso === null ? "hidden" : ""}">
      ${moneyField("v", OB.imp, OB.fisso === false ? (two ? "Quanto entra in media al mese (tu)" : "Quanto entra in media al mese") : (two ? "Il tuo stipendio" : "Quanto prendi al mese"))}
      ${two ? moneyField("v2", OB.imp2, "Lo stipendio dell'altra persona") : ""}
      ${OB.fisso ? `<label class="f" for="g">In che giorno arriva?</label><input class="in" id="g" inputmode="numeric" value="${esc(OB.giorno)}">` : `<p class="small">Stima pure a occhio: nei prossimi mesi vediamo insieme se torna.</p>`}</div>`;
  } else if (st.kind === "rapidi") {
    body = `<div class="chips">${RAPIDI_CATALOGO.map(r => `<button class="chip ${OB.rapidi.has(r.nome) ? "on" : ""}" data-rap="${esc(r.nome)}" aria-pressed="${OB.rapidi.has(r.nome)}">${esc(r.nome)}${r.tipo === "fisso" ? ` · ${fmt2(r.prezzo)}` : ""}</button>`).join("")}</div>
      <p class="small" style="margin-top:12px">Per alcune voci, come le sigarette, ti chiediamo il prezzo la prima volta. Spesa e benzina aprono il tastierino.</p>`;
  }
  root.innerHTML = `<div class="ob">
    <div class="row"><button class="ibtn" id="back" aria-label="Indietro">${ico("left", 2.4)}</button><div class="label">Passo ${OB.step} di 8</div><div style="width:44px"></div></div>
    <div class="steps" aria-hidden="true">${OB_STEPS.map((_, i) => `<i class="${i < OB.step ? "on" : ""}"></i>`).join("")}</div>
    <div class="center">${piggy(LEVELS[0].piggy, true, 150)}</div>
    <div><h1>${st.q}</h1>${st.s ? `<p class="sub" style="margin-top:8px">${st.s}</p>` : ""}</div>
    <div>${body}</div>
    <div class="push"><button class="btn" id="next">${OB.step === 8 ? "Fatto!" : "Avanti"}</button>
    ${st.kind === "money" ? '<button class="link" id="skip" style="display:block;margin:6px auto 0">Non lo so, salto</button>' : ""}</div></div>`;
  $("#back").onclick = () => { syncOB(); OB.step--; renderOB(); };
  $("#next").onclick = () => { syncOB(); if (st.kind === "stipendio" && OB.fisso === null) { toast("Scegli se lo stipendio è fisso"); return; } if (st.kind === "stipendio" && !num(OB.imp)) { toast("Scrivi una cifra, anche approssimativa"); return; } if (OB.step === 8) finishOB(); else { OB.step++; renderOB(); } };
  const sk = $("#skip"); if (sk) sk.onclick = () => { OB[st.key] = ""; OB.step++; renderOB(); };
  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { OB.modo = b.dataset.modo; renderOB(); });
  document.querySelectorAll("[data-fisso]").forEach(b => b.onclick = () => { syncOB(); OB.fisso = b.dataset.fisso === "1"; renderOB(); });
  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { OB[st.key] = b.dataset.chip; renderOB(); });
  document.querySelectorAll("[data-rap]").forEach(b => b.onclick = () => { const n = b.dataset.rap; OB.rapidi.has(n) ? OB.rapidi.delete(n) : OB.rapidi.add(n); renderOB(); });
}
function syncOB() {
  const st = OB_STEPS[OB.step - 1]; if (!st) return;
  if (st.kind === "money" && $("#v")) OB[st.key] = $("#v").value;
  if (st.kind === "stipendio") { if ($("#v")) OB.imp = $("#v").value; if ($("#v2")) OB.imp2 = $("#v2").value; if ($("#g")) OB.giorno = $("#g").value; }
}
function finishOB() {
  const s = blank(); const t = iso(today());
  s.setup = true; s.setupAt = t; s.modo = OB.modo;
  s.entrate = { tipo: OB.fisso ? "fisso" : "variabile", importo: num(OB.imp), importo2: num(OB.imp2), giorno: clamp(parseInt(OB.giorno, 10) || 23, 1, 31) };
  if (num(OB.casa)) s.fisse.push({ id:uid(), nome:"Casa (affitto o mutuo e bollette)", importo:num(OB.casa) });
  if (num(OB.abb)) s.fisse.push({ id:uid(), nome:"Abbonamenti", importo:num(OB.abb) });
  if (num(OB.debiti) || num(OB.rate)) s.debiti.push({ id:uid(), nome:"Debiti e rate", tipo:"prestito", saldo:num(OB.debiti) || num(OB.rate) * 12, saldoIniziale:num(OB.debiti) || num(OB.rate) * 12, tasso:null, rata:num(OB.rate), creato:t });
  s.fondo.saldo = num(OB.risparmi);
  s.rapidi = RAPIDI_CATALOGO.filter(r => OB.rapidi.has(r.nome)).map(r => ({ ...r, id:uid() }));
  S = s; OB = null;
  check(true); save(); VIEW = "home"; render();
  setTimeout(() => celebraLivello(S.livello.max, -1), 300);
}

/* =========================================================
   VISTE
   ========================================================= */
let VIEW = "home", WEEK = 0;

  if (!S.setup) { if (!OB) startOnboarding(); else renderOB(); return; }
  const lv = S.livello.max; applyTheme(lv);
  const views = { home:vHome, spese:vSpese, piano:vPiano, traguardi:vTraguardi };
  $("#root").innerHTML = `<div class="wrap">
    <div class="top"><div class="brand">Cipignolo</div><div class="icons">
      <button class="ibtn" data-a="ai" aria-label="Chiedi a un'AI">${ico("ai")}</button>
      <button class="ibtn" data-a="settings" aria-label="Impostazioni">${ico("gear")}</button></div></div>
    ${views[VIEW]()}</div>
    <nav class="tabs" aria-label="Sezioni"><div class="in">
    ${[["home","Home"],["spese","Spese"],["piano","Piano"],["traguardi","Traguardi"]].map(([k, l]) => `<button data-tab="${k}" class="${VIEW === k ? "on" : ""}" ${VIEW === k ? 'aria-current="page"' : ""}>${ico(k, VIEW === k ? 2.3 : 2)}${l}</button>`).join("")}
    </div></nav>`;
}

/* ---------- HOME ---------- */
function vHome() {
  const lv = S.livello.max, L = LEVELS[lv], pausa = livelloInPausa();

  const w = settimana(0), spent = sum(speseIn(w.a, w.b), s => s.importo), bs = budgetSett();
  const left = bs - spent, used = bs > 0 ? clamp(spent / bs * 100, 0, 100) : 0;
  const giorniRest = 7 - ((today().getDay() + 6) % 7);
  const sf = sfidaDi(today()); const sfOk = sf.ok(speseIn(w.a, today()));
  const tip = consigli()[0];
  const fondoPausa = pausa === 2 || pausa === 5;
  const msg = pausa ? (fondoPausa ? "Il fondo ha fatto il suo lavoro. Ora lo ricostruiamo." : "Un passo indietro capita: si riparte da qui.") : MSG[lv];
  return `
  <section class="hero">
    ${lv === 7 ? `<div class="deco coin" style="left:30px;top:24px">€</div><div class="deco coin" style="right:40px;top:70px;width:22px;height:22px;font-size:11px">€</div><div class="deco coin" style="left:58px;top:150px;width:18px;height:18px"></div>` : ""}
    ${lv === 5 ? `<div class="deco note" style="left:24px;top:40px;transform:rotate(-14deg)"></div><div class="deco note" style="right:28px;top:118px;transform:rotate(12deg)"></div>` : ""}
    ${piggy(L.piggy, L.ghost, 190)}
    <span class="pill">Livello ${lv} · ${L.n}${pausa ? " · in pausa" : ""}</span>
    <div class="msg">${msg}</div>
    <div style="width:100%"><div class="bar"><i style="width:${pr.p}%"></i></div><div class="hint" style="margin-top:6px">${esc(pr.h)}</div></div>
  </section>
  <div class="card row">
    <div class="col"><span class="label">${left >= 0 ? "Questa settimana puoi spendere" : "Questa settimana sei oltre di"}</span>
      <span class="big" style="${left < 0 ? "color:var(--warn)" : ""}">${fmt(Math.abs(left))}</span>
      <span class="small">su ${fmt(bs)} · ${giorniRest === 1 ? "ultimo giorno" : `mancano ${giorniRest} giorni`}</span></div>
    <div class="ring" aria-hidden="true" style="background:conic-gradient(${left < 0 ? "var(--warnbar)" : "var(--accent)"} 0 ${used}%, rgba(59,36,48,.1) ${used}% 100%)"><div>${pct(used)}</div></div>
  </div>
  <h2 class="s">Spesa rapida</h2>
  <div class="grid3">
    ${S.rapidi.map(r => `<button class="qbtn" data-q="${r.id}">${ico(icoFor(r))}<b>${esc(r.nome)}</b><span>${r.tipo === "libero" ? "Inserisci" : r.prezzo != null ? fmt2(r.prezzo) : "Imposta prezzo"}</span></button>`).join("")}
    <button class="qbtn add" data-a="addSpesa">${ico("plus", 2.4)}<b>Altro</b></button>
  </div>
  <div class="card row" style="gap:14px"><div class="dot" style="background:${sfOk ? "var(--goodbg)" : "var(--bg)"}">${ico(sfOk ? "check" : "traguardi", 2.2, sfOk ? "#1E6B40" : "currentColor").replace("<svg", '<svg width="22" height="22"')}</div>
    <div class="col" style="flex:1"><span class="label">Sfida della settimana</span><b style="font-size:15px">${sf.t}</b><span class="small">${sfOk ? "Per ora ci sei, continua così!" : "Si chiude domenica: c'è tempo."}</span></div></div>
  ${tip ? tipHtml(tip) : ""}
  <div class="tip help"><svg viewBox="0 0 24 24" fill="none" stroke="#136D7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON.heart}</svg><p>${HABITS[Math.floor(Date.now() / 864e5) % HABITS.length]}</p></div>
  <button class="btn line" data-a="consigli">Tutti i consigli</button>
  ${backupReminder()}`;
}
function tipHtml(c) {
  const col = c.k === "warn" ? "#B4541A" : c.k === "help" ? "#136D7D" : "#8A5A00";
  return `<div class="tip ${c.k === "warn" ? "warn" : c.k === "help" ? "help" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[c.k === "help" ? "heart" : "bulb"]}</svg><p>${c.t}</p></div>`;
}
function backupReminder() {
  const last = S.ultimoBackup ? daysBetween(parse(S.ultimoBackup), today()) : (S.setupAt ? daysBetween(parse(S.setupAt), today()) : 0);
  if (last < 30) return "";
  return `<div class="tip warn"><svg viewBox="0 0 24 24" fill="none" stroke="#B4541A" stroke-width="2" stroke-linecap="round" aria-hidden="true">${ICON.cal}</svg><p>È passato un mese dall'ultimo backup. Salvalo dalle impostazioni: se cambi telefono non perdi niente.</p></div>`;
}

/* ---------- SPESE ---------- */
function vSpese() {
  const w = settimana(WEEK), sp = speseIn(w.a, w.b).sort((a, b) => b.data.localeCompare(a.data) || (b.ts || 0) - (a.ts || 0));
  const spent = sum(sp, s => s.importo), bs = budgetSett(), left = bs - spent;
  const by = {}; sp.forEach(s => by[s.cat] = (by[s.cat] || 0) + s.importo);
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const days = {}; sp.forEach(s => (days[s.data] = days[s.data] || []).push(s));
  const label = d => { const x = daysBetween(parse(d), today()); return x === 0 ? "Oggi" : x === 1 ? "Ieri" : `${GIORNI[parse(d).getDay()][0].toUpperCase() + GIORNI[parse(d).getDay()].slice(1)} ${parse(d).getDate()}`; };
  const range = `${w.a.getDate()}${w.a.getMonth() !== w.b.getMonth() ? " " + MESI_B[w.a.getMonth()] : ""} – ${w.b.getDate()} ${MESI_B[w.b.getMonth()]}`;
  const tip = consigli().find(c => /pesa il/.test(c.t));
  return `
  <h1 class="t">Spese</h1>
  <div class="card row" style="padding:4px;border-radius:999px">
    <button class="ibtn" data-a="wprev" aria-label="Settimana precedente" style="box-shadow:none;background:var(--bg)">${ico("left", 2.4)}</button>
    <b style="font-size:15px">${WEEK === 0 ? "Questa settimana" : `Settimana ${range}`}</b>
    <button class="ibtn" data-a="wnext" aria-label="Settimana successiva" style="box-shadow:none;background:var(--bg)" ${WEEK >= 0 ? "disabled" : ""}>${ico("right", 2.4, WEEK >= 0 ? "#C9BCC2" : "currentColor")}</button>
  </div>
  <div class="card">
    <div class="row" style="align-items:flex-end"><div class="col"><span class="label">Speso</span><span class="mid" style="color:var(--text)">${fmt(spent)}</span></div>
    <div class="col" style="align-items:flex-end"><span class="label">${left >= 0 ? "Resta" : "Oltre di"}</span><span class="mid" style="${left < 0 ? "color:var(--warn)" : ""}">${fmt(Math.abs(left))}</span></div></div>
    <div class="bar ${left < 0 ? "over" : ""}" style="margin-top:10px"><i style="width:${bs ? clamp(spent / bs * 100, 0, 100) : 0}%"></i></div>
    <p class="small" style="margin:8px 0 0">Budget della settimana: ${fmt(bs)}</p>

  ${cats.length ? `<h2 class="s">Dove sono andati</h2><div class="card">${cats.map(([c, v], i) => `<div style="margin:6px 0 10px"><div class="row" style="font-weight:800;font-size:14px"><span>${esc(c)}</span><span>${fmt2(v)}</span></div><div class="bar thin" style="margin-top:4px"><i style="width:${spent ? v / spent * 100 : 0}%;background:${["#3DAA6B","#FF8A5C","#9B7BE0","#2FB3C9","#EC6F9A","#E8A90C","#9AA6B2","#C9BCC2"][i % 8]}"></i></div></div>`).join("")}</div>` : ""}
  ${tip ? tipHtml(tip) : ""}
  <h2 class="s">Movimenti <button class="mini" data-a="addSpesa">+ Spesa</button></h2>
  ${sp.length ? Object.keys(days).sort().reverse().map(d => `<div class="row" style="padding:8px 4px 6px;font-weight:800;font-size:14px;color:var(--text2)"><span>${label(d)}</span><span>${fmt2(sum(days[d], s => s.importo))}</span></div>
    <div class="list">${days[d].map(s => { const ci = Math.max(0, S.categorie.indexOf(s.cat)); return `<button class="item" data-edit="${s.id}"><div class="dot" style="background:${CAT_TINT[ci % CAT_TINT.length]}">${esc((s.nome || s.cat).charAt(0).toUpperCase())}</div><div class="grow"><b>${esc(s.nome || s.cat)}</b><span class="small">${esc(s.cat)}</span></div><span class="amt">${fmt2(s.importo)}</span></button>`; }).join("")}</div>`).join("")
    : `<div class="card center small">Nessuna spesa in questa settimana.<br>Usa i tasti rapidi nella Home: basta un tocco.</div>`}
  <button class="btn line" data-a="addExtra" style="margin-top:18px">+ Entrata extra (tredicesima, premio, 730…)</button>`;
}

/* ---------- PIANO ---------- */
function vPiano() {
  const deb = ordineDebiti(), firstOpen = deb.find(d => d.saldo > 0 && d.tipo !== "mutuo");
  const sm = speseMese(), f1 = sm, f3 = sm * mesiTarget(), fs = S.fondo.saldo;
  const target = fs < f1 ? f1 : f3, avz = Math.max(0, avanzo()), cari = debitiCari().length > 0;
  const lv = S.livello.max;
  const prossime = S.scadenze.filter(s => !s.fatto).sort((a, b) => (a.data || "9").localeCompare(b.data || "9"));
  const fatte = S.scadenze.filter(s => s.fatto);
  return `
  <h1 class="t">Piano</h1><p class="sub">Debiti, fondo, obiettivi e scadenze.</p>
  <h2 class="s">Debiti <button class="mini" data-a="addDebito">+ Debito</button></h2>
  ${deb.length ? `<p class="small" style="margin:-4px 0 8px">Nell'ordine consigliato: prima i più cari, il mutuo per ultimo.</p>` : ""}
  ${deb.map((d, i) => { const n = mesiAllaChiusura(d), chiuso = d.saldo <= 0, ini = d.saldoIniziale || d.saldo;
    const fine = chiuso ? "Chiuso!" : n === null ? "Rata libera" : n === Infinity ? "La rata copre solo gli interessi" : `Chiuso a ${meseFra(n)}`;
    return `<button class="card" data-deb="${d.id}" style="display:block;width:100%;border:${d === firstOpen && cari ? "2px solid var(--accent)" : "0"};text-align:left;padding:14px 16px;margin:10px 0">
      <div class="row"><div class="row" style="gap:10px;min-width:0"><div class="dot" style="width:30px;height:30px;font-size:14px;background:${chiuso ? "var(--goodbg)" : CAT_TINT[i % CAT_TINT.length]}">${chiuso ? "✓" : i + 1}</div>
      <div class="col" style="min-width:0"><b style="font-size:15px">${esc(d.nome)}</b><span class="small">${d.tasso == null ? "Tasso da inserire" : `Tasso ${String(d.tasso).replace(".", ",")}%`}${d.rata ? ` · rata ${fmt(d.rata)}` : ""}${isCaro(d) ? ` · circa ${fmt(interessiMese(d))} di interessi al mese` : ""}</span></div></div>
      ${d === firstOpen && cari ? '<span class="tag" style="background:var(--piggy)">Prima questo</span>' : ""}</div>
      <div class="bar thin" style="margin:10px 0 6px"><i style="width:${ini > 0 ? clamp((1 - d.saldo / ini) * 100, 0, 100) : 100}%"></i></div>
      <div class="row small" style="font-weight:700"><span>${chiuso ? "Pagato tutto" : `Restano ${fmt(d.saldo)}`}</span><span>${fine}</span></div></button>`; }).join("") || `<div class="card small center">Nessun debito inserito. Ottimo!</div>`}

  <h2 class="s">Fondo di emergenza</h2>
  <button class="card" data-a="fondo" style="display:block;width:100%;border:0;text-align:left">
    <div class="row" style="align-items:baseline"><span class="mid">${fmt(fs)}</span><span class="small">obiettivo ${fs < f1 ? "1 mese" : mesiTarget() + " mesi"}: ${fmt(target)}</span></div>
    <div class="bar" style="margin:8px 0"><i style="width:${target ? clamp(fs / target * 100, 0, 100) : 0}%"></i></div>
    <span class="small">${fs >= f3 ? "Fondo pieno: gli imprevisti fanno meno paura." : `Copre ${fondoMesi().toFixed(1).replace(".", ",")} mesi di spese. Tocca per aggiornarlo.`}</span></button>

  <h2 class="s">Obiettivi <button class="mini" data-a="addObiettivo">+ Nuovo</button></h2>
  ${S.obiettivi.filter(o => !o.grande).map(o => objCard(o, avz, cari)).join("") || `<div class="card small">Vacanza, auto, regali: crea un obiettivo e guardalo crescere.</div>`}
  ${lv >= 5 ? `<h2 class="s">Grandi obiettivi <button class="mini" data-a="addGrande">+ Nuovo</button></h2>${S.obiettivi.filter(o => o.grande).map(o => objCard(o, avz, cari)).join("") || `<div class="card small">Casa, anticipo, cifre importanti: qui vedi quanti anni servono, con le tappe da festeggiare.</div>`}`
    : `<div class="card row" style="gap:12px;background:rgba(255,255,255,.55);border:2px dashed #D6CCD1;box-shadow:none">${ico("lock", 2, "#6B5560").replace("<svg", '<svg width="24" height="24" style="flex:none"')}<div class="col"><b style="color:var(--text2)">Grandi obiettivi</b><span class="small">Casa, anticipo, cifre importanti. Si sbloccano al livello 5 · Fondo pieno.</span></div></div>`}

  <h2 class="s">Scadenze <button class="mini" data-a="addScad">+ Nuova</button></h2>
  <div class="list">${prossime.map(scadRow).join("") || `<div class="item small" style="justify-content:center">Niente in scadenza.</div>`}</div>
  ${fatte.length ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer;min-height:36px;display:flex;align-items:center">Fatte (${fatte.length})</summary><div class="list" style="margin-top:6px">${fatte.map(scadRow).join("")}</div></details>` : ""}
  <button class="btn ghost" data-a="calendario">${ico("cal", 2.2).replace("<svg", '<svg width="20" height="20"')} Aggiungi al calendario</button>
  <p class="small center" style="margin-top:6px">Giorno di paga e check di 5 minuti la domenica, come promemoria del telefono.</p>
  <p class="disc">Cipignolo ti dà numeri e idee, le decisioni restano tue.</p>`;
}
function objCard(o, avz, cari) {
  const pc = o.target > 0 ? clamp(o.saldo / o.target * 100, 0, 100) : 0;
  const quota = Math.round(avz * (cari ? .10 : .40)), dopo = Math.round(avz * .40);
  let extra;
  if (o.grande) {
    const m = quota > 0 ? Math.ceil((o.target - o.saldo) / quota) : null;
    extra = m ? `Con ${fmt(quota)} al mese ci arrivi in circa ${m >= 24 ? Math.round(m / 12) + " anni" : m + " mesi"}. Per obiettivi così lunghi informati su come far crescere i risparmi, anche con un consulente indipendente.` : "Quando avanza qualcosa ogni mese, ti diciamo in quanto tempo ci arrivi.";
    const tappe = [10, 25, 50, 75].filter(t => pc >= t); if (tappe.length) extra += ` Tappa raggiunta: ${tappe.pop()}%!`;
  } else extra = o.saldo >= o.target ? "Obiettivo raggiunto!" : cari ? `${fmt(quota)} al mese adesso, ${fmt(dopo)} quando chiudi i debiti cari.` : `Suggerito: circa ${fmt(quota)} al mese.`;
  return `<button class="card" data-obj="${o.id}" style="display:block;width:100%;border:0;text-align:left">
    <div class="row" style="font-weight:800;font-size:15px"><span>${esc(o.nome)}</span><span>${fmt(o.saldo)} su ${fmt(o.target)}</span></div>
    <div class="bar thin" style="margin:8px 0"><i style="width:${pc}%;background:#3DAA6B"></i></div>
    <span class="small">${extra}</span></button>`;
}

  return `<label class="item" style="cursor:pointer"><input type="checkbox" data-scad="${s.id}" ${s.fatto ? "checked" : ""} style="width:24px;height:24px;accent-color:var(--accent);flex:none" aria-label="Fatto">

document.addEventListener("click", e => {

  if (!t || !S.setup) return;
  if (t.dataset.tab) { VIEW = t.dataset.tab; WEEK = 0; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.q) return tapRapido(t.dataset.q);

  if (t.dataset.delscad) { e.preventDefault(); const s = S.scadenze.find(x => x.id === t.dataset.delscad); const i = S.scadenze.indexOf(s); S.scadenze.splice(i, 1); return commit("Scadenza eliminata", () => { S.scadenze.splice(i, 0, s); commit(); }); }
  const a = t.dataset.a;
  const A = { ai, settings, addSpesa:() => editSpesa(null), addExtra, addDebito:() => editDebito(null), fondo:editFondo, addObiettivo:() => editObiettivo(null), addGrande:() => editObiettivo(null, true), addScad, calendario, consigli:allConsigli,
    wprev:() => { WEEK--; render(); }, wnext:() => { if (WEEK < 0) { WEEK++; render(); } } };
  A[a] && A[a]();
});

  S.fondo.saldo = Math.max(0, Math.round(v * 100) / 100);
}

/* ---------- Chiedi a un'AI ---------- */
function riassuntoAI() {
  const tipoNome = { carta:"Carta di credito", prestito:"Prestito", mutuo:"Mutuo", altro:"Altro debito" };
  const lines = [
    "Ciao! Uso un'app per tenere sotto controllo i miei soldi e vorrei un parere. Ecco la mia situazione, solo numeri:",
    "",
    `- Entrate: circa ${fmt(entrate())} al mese (stipendio ${S.entrate.tipo === "fisso" ? "fisso" : "variabile, questa è la media"}${S.modo === "coppia" ? ", siamo in due" : ""})`,
    `- Spese fisse (casa, abbonamenti, ecc.): ${fmt(fisseTot())} al mese`,
    `- Rate: ${fmt(rateTot())} al mese`,
    `- Budget per le spese di tutti i giorni: ${fmt(budgetMese())} al mese`,
    `- Avanzo stimato: ${fmt(avanzo())} al mese`,
    `- Fondo di emergenza: ${fmt(S.fondo.saldo)} (copre circa ${fondoMesi().toFixed(1).replace(".", ",")} mesi di spese)`
  ];
  const deb = ordineDebiti().filter(d => d.saldo > 0);
  if (deb.length) { lines.push("- Debiti:"); deb.forEach(d => lines.push(`  • ${tipoNome[d.tipo] || "Debito"}: restano ${fmt(d.saldo)}${d.tasso != null ? `, tasso ${String(d.tasso).replace(".", ",")}%` : ", tasso non noto"}${d.rata ? `, rata ${fmt(d.rata)} al mese` : ""}`)); }
  const m = meseCorrente(), sp = speseIn(m.a, m.b);
  if (sp.length) { const by = {}; sp.forEach(s => by[s.cat] = (by[s.cat] || 0) + s.importo); lines.push(`- Spese variabili di questo mese: ${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${c} ${fmt(v)}`).join(", ")}`); }
  lines.push("", "Qual è il prossimo passo più utile per me? Spiegamelo in modo semplice e pratico, senza giudicare.");
  return lines.join("\n");
}

/* ---------- Calendario (.ics) ---------- */
function calendario() {
  const g = clamp(+S.entrate.giorno || 23, 1, 28), now = today();
  let pay = new Date(now.getFullYear(), now.getMonth(), g); if (pay < now) pay = new Date(now.getFullYear(), now.getMonth() + 1, g);
  const sun = addDays(now, (7 - now.getDay()) % 7);
  const d8 = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ev = (uidS, start, rrule, title, desc) => ["BEGIN:VEVENT", `UID:${uidS}@cipignolo`, `DTSTAMP:${stamp}`, `DTSTART:${d8(start)}T${uidS === "paga" ? "090000" : "180000"}`, "DURATION:PT10M", `RRULE:${rrule}`, `SUMMARY:${title}`, `DESCRIPTION:${desc}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"];
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Cipignolo//IT", "CALSCALE:GREGORIAN",
    ...(S.entrate.tipo === "fisso" ? ev("paga", pay, `FREQ=MONTHLY;BYMONTHDAY=${g}`, "Cipignolo: giorno di paga", "Il rito dei 5 minuti: apri Cipignolo e sistema il mese.") : []),
    ...ev("domenica", sun, "FREQ=WEEKLY;BYDAY=SU", "Cipignolo: check della domenica", "5 minuti per vedere come è andata la settimana."),
    "END:VCALENDAR"];
  download(new Blob([lines.join("\r\n")], { type:"text/calendar" }), "cipignolo-promemoria.ics");
  toast("Apri il file per aggiungere i promemoria al calendario");
}
async function download(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- Backup ---------- */
function esporta() {
  S.ultimoBackup = iso(today()); save();
  download(new Blob([JSON.stringify(S, null, 2)], { type:"application/json" }), `cipignolo-backup-${iso(today())}.json`);
  toast("Backup salvato: tienilo al sicuro");
}
function importa() {
  const fi = $("#fileIn"); fi.value = "";
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !d.entrate) throw 0;
        S = Object.assign(blank(), d); S.setup = true; OB = null; check(true); save(); closeSheet(true); VIEW = "home"; render(); toast("Dati importati!"); }
      catch (e) { toast("Questo file non sembra un backup di Cipignolo"); } };
    r.readAsText(f); };
  fi.click();
}

/* ---------- Impostazioni ---------- */
function settings() {
  const e = S.entrate;
  sheet(`<h3>Impostazioni</h3>
    <label class="f">Conti</label><div class="seg"><button class="opt ${S.modo === "solo" ? "on" : ""}" data-m="solo">Da solo</button><button class="opt ${S.modo === "coppia" ? "on" : ""}" data-m="coppia">In coppia</button></div>
    <label class="f">Stipendio</label><div class="seg"><button class="opt ${e.tipo === "fisso" ? "on" : ""}" data-st="fisso">Fisso</button><button class="opt ${e.tipo === "variabile" ? "on" : ""}" data-st="variabile">Variabile (media)</button></div>
    ${moneyField("s1", e.importo, e.tipo === "fisso" ? "Stipendio al mese" : "Media al mese")}
    <div id="s2w" class="${S.modo === "coppia" ? "" : "hidden"}">${moneyField("s2", e.importo2, "Stipendio dell'altra persona")}</div>
    <label class="f" for="sg">Giorno di paga</label><input class="in" id="sg" inputmode="numeric" value="${e.giorno}">
    ${moneyField("sb", budgetMese(), `Budget spese variabili al mese (suggerito ${fmt(budgetSuggerito())})`)}
    <p class="small">Circa ${fmt(budgetSett())} a settimana.</p>
    <label class="f">Spese fisse al mese</label><div id="fx">${S.fisse.map(fxRow).join("")}</div><button class="btn line" id="addfx">+ Spesa fissa</button>
    <label class="f">Tasti rapidi</label><div id="rq">${S.rapidi.map(rqRow).join("")}</div>
    <select class="in" id="rqAdd" aria-label="Aggiungi tasto rapido"><option value="">+ Aggiungi un tasto rapido</option>${RAPIDI_CATALOGO.filter(r => !S.rapidi.some(x => x.nome === r.nome)).map(r => `<option value="${esc(r.nome)}">${esc(r.nome)}</option>`).join("")}</select>
    <button class="btn" id="save">Salva</button>
    <h3 style="font-size:20px;margin-top:26px">Backup</h3>
    <p class="small">I dati sono solo su questo telefono. Su iPhone, se non apri l'app per molte settimane, potrebbero essere cancellati: salva un backup ogni tanto.${S.ultimoBackup ? ` Ultimo: ${parse(S.ultimoBackup).toLocaleDateString("it-IT")}.` : ""}</p>
    <button class="btn ghost" id="exp">Salva backup</button><button class="btn ghost" id="imp">Importa backup</button>
    <button class="btn danger" id="reset" style="margin-top:26px">Cancella tutti i dati</button>
    <p class="disc">Cipignolo è gratuito e senza pubblicità. Non è consulenza finanziaria: dà numeri e idee, le decisioni restano tue.</p>`, b => {
    let modo = S.modo, tipo = e.tipo;
    b.querySelectorAll("[data-m]").forEach(x => x.onclick = () => { modo = x.dataset.m; b.querySelectorAll("[data-m]").forEach(y => y.classList.toggle("on", y === x)); $("#s2w", b).classList.toggle("hidden", modo !== "coppia"); });
    b.querySelectorAll("[data-st]").forEach(x => x.onclick = () => { tipo = x.dataset.st; b.querySelectorAll("[data-st]").forEach(y => y.classList.toggle("on", y === x)); });
    $("#addfx", b).onclick = () => { $("#fx", b).insertAdjacentHTML("beforeend", fxRow({ id:uid(), nome:"", importo:"" })); };
    b.addEventListener("click", ev => { const d = ev.target.closest("[data-rm]"); if (d) d.closest(".fxr").remove(); });
    $("#rqAdd", b).onchange = ev => { const r = RAPIDI_CATALOGO.find(x => x.nome === ev.target.value); if (r) { $("#rq", b).insertAdjacentHTML("beforeend", rqRow({ ...r, id:uid() })); ev.target.querySelector(`option[value="${CSS.escape(r.nome)}"]`)?.remove(); ev.target.value = ""; } };
    $("#save", b).onclick = () => {
      S.modo = modo; S.entrate = { tipo, importo:num($("#s1", b).value), importo2:num($("#s2", b).value), giorno:clamp(parseInt($("#sg", b).value, 10) || 23, 1, 31) };
      const bud = num($("#sb", b).value); S.budgetMensile = bud > 0 ? bud : null;
      S.fisse = [...b.querySelectorAll("#fx .fxr")].map(r => ({ id:r.dataset.id, nome:$(".n", r).value.trim(), importo:num($(".v", r).value) })).filter(f => f.nome && f.importo);
      S.rapidi = [...b.querySelectorAll("#rq .fxr")].map(r => { const base = JSON.parse(r.dataset.r); const p = numOrNull($(".v", r).value); return { ...base, prezzo: base.tipo === "libero" ? null : p }; });
      closeSheet(); commit("Impostazioni salvate"); };
    $("#exp", b).onclick = esporta; $("#imp", b).onclick = importa;
    $("#reset", b).onclick = () => sheet(`<h3>Sicuro?</h3><p class="sub">Cancelli tutti i dati da questo telefono. Se non hai un backup, non si possono recuperare.</p><button class="btn danger" id="yes">Sì, cancella tutto</button><button class="btn ghost" id="no">No, torna indietro</button>`, c => {
      $("#yes", c).onclick = () => { localStorage.removeItem(KEY); S = blank(); closeSheet(true); OB = null; render(); };
      $("#no", c).onclick = () => { closeSheet(); setTimeout(settings, 220); };
    });
  });
}
const fxRow = f => `<div class="fxr row" data-id="${f.id}" style="gap:8px;margin-bottom:8px"><input class="in n" aria-label="Voce" value="${esc(f.nome)}" placeholder="Voce" style="flex:1"><input class="in v" aria-label="Importo" inputmode="decimal" value="${f.importo !== "" ? String(f.importo).replace(".", ",") : ""}" placeholder="€" style="width:96px"><button class="ibtn" data-rm aria-label="Rimuovi" style="box-shadow:none;background:var(--bg)">${ico("plus", 2.2).replace("<svg", '<svg style="transform:rotate(45deg)"')}</button></div>`;
const rqRow = r => `<div class="fxr row" data-r='${esc(JSON.stringify(r))}' style="gap:8px;margin-bottom:8px"><span style="flex:1;font-weight:800">${esc(r.nome)}</span>${r.tipo === "libero" ? '<span class="small" style="width:96px;text-align:center">a importo</span><input class="v hidden">' : `<input class="in v" aria-label="Prezzo ${esc(r.nome)}" inputmode="decimal" value="${r.prezzo != null ? String(r.prezzo).replace(".", ",") : ""}" placeholder="€" style="width:96px">`}<button class="ibtn" data-rm aria-label="Rimuovi ${esc(r.nome)}" style="box-shadow:none;background:var(--bg)">${ico("plus", 2.2).replace("<svg", '<svg style="transform:rotate(45deg)"')}</button></div>`;

/* ---------- avvio ---------- */
if (S.setup) check(true);
render();
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.setup) { check(); render(); } });
})();
</script>
</body>
</html>
