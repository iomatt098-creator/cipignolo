<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cipignolo">
<meta name="description" content="Cipignolo – fai contare i tuoi soldi. App gratuita, i dati restano sul tuo telefono.">
<title>Cipignolo – fai contare i tuoi soldi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFF8EE'/%3E%3Cellipse cx='48' cy='56' rx='32' ry='24' fill='%23F9A8C9' stroke='%232E2A26' stroke-width='3.5'/%3E%3Cellipse cx='80' cy='58' rx='8' ry='7' fill='%23F9A8C9' stroke='%232E2A26' stroke-width='3.5'/%3E%3Crect x='38' y='34' width='16' height='4.5' rx='2.25' fill='%232E2A26'/%3E%3Ccircle cx='66' cy='48' r='3.5' fill='%232E2A26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --cream:#FFF8EE;
  --bg:#FFF8EE;
  --lv:#F9A8C9;
  --accent:#F9A8C9;
  --ink:#8F3B5D;
  --piggy:#F9A8C9;
  --text:#2E2A26;
  --text2:#5A4F47;
  --muted:#6E6259;
  --card:#FFFFFF;
  --soft:#F5ECE0;
  --line:#EDE1D1;
  --warn:#A84E0E;
  --warnbar:#F4A259;
  --warnbg:#FFEED9;
  --good:#1E6E43;
  --goodbg:#E0F5E9;
  --gold:#F5C542;
  --goldline:#C89211;
  --shadow:0 10px 28px rgba(46,42,38,.08), 0 2px 6px rgba(46,42,38,.04);
  --shadow-sm:0 4px 14px rgba(46,42,38,.06);
  --head:'Fredoka',ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font:16px/1.45 'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:0 18px calc(116px + env(safe-area-inset-bottom));
}
.wrap.in-home{padding-top:0}
.wrap:not(.in-home){padding-top:calc(env(safe-area-inset-top) + 12px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand-wrap{display:flex;align-items:center;gap:9px}
.brand{font-family:var(--head);font-weight:700;font-size:27px;color:var(--text);letter-spacing:-.01em}
.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--lv);display:inline-block;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.icons{display:flex;gap:10px}
.ibtn{
  width:46px;height:46px;border-radius:23px;border:0;
  background:var(--card);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);flex:none;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.ibtn:active{transform:scale(.92)}
.ibtn:disabled{opacity:.45;cursor:default;transform:none}
.ibtn svg{width:22px;height:22px}

h1.t{font-family:var(--head);font-weight:700;font-size:32px;color:var(--text);margin:8px 0 4px;letter-spacing:-.01em}
h2.s{
  font-family:var(--head);font-weight:600;font-size:21px;color:var(--text);
  margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.sub{color:var(--text2);font-weight:700;font-size:15.5px;margin:0}
.card{
  background:var(--card);border-radius:24px;padding:18px 20px;
  box-shadow:var(--shadow);margin:14px 0;border:0;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.center{text-align:center}
.small{font-size:14.5px;font-weight:700;color:var(--text2);line-height:1.42}
.label{font-size:15px;font-weight:800;color:var(--text2)}
.big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.05;color:var(--text);letter-spacing:-.01em}
.mid{font-family:var(--head);font-weight:700;font-size:28px;color:var(--text)}

.bar{height:14px;border-radius:999px;background:rgba(46,42,38,.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--lv);transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar.thin{height:10px}
.bar.over>i{background:var(--warnbar)}

.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 16px;border-radius:999px;white-space:nowrap;
  font-weight:800;font-size:14px;line-height:1;
  background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);
}
.tag{
  display:inline-flex;align-items:center;justify-content:center;
  height:26px;padding:0 12px;border-radius:999px;white-space:nowrap;
  font-weight:800;font-size:12px;line-height:1;flex:none;color:var(--text);
}

/* 1. PALCO COLORATO A TUTTA LARGHEZZA IN HOME */
.stage{
  margin:0 -18px;
  padding:calc(env(safe-area-inset-top) + 12px) 20px 58px;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--lv) 58%, #FFF8EE) 0%,
    color-mix(in srgb, var(--lv) 34%, #FFF8EE) 100%);
  border-radius:0 0 38px 38px;
  box-shadow:0 10px 26px rgba(46,42,38,.06);
  position:relative;
  overflow:hidden;
}
.stage::before{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.32);top:-70px;right:-60px;pointer-events:none;
}
.stage::after{
  content:"";position:absolute;width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.24);bottom:18px;left:-50px;pointer-events:none;
}
.hero{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;z-index:1;padding-top:2px;
}
.hero-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:176px}
.hero .msg{font-family:var(--head);font-weight:600;font-size:21px;text-align:center;color:var(--text);line-height:1.25}
.hero .hint{font-size:15px;font-weight:800;color:var(--text2);text-align:center}
.stage .bar{background:rgba(46,42,38,.13);box-shadow:inset 0 1px 3px rgba(46,42,38,.08)}
.stage .bar>i{background:#FFFFFF;box-shadow:0 1px 4px rgba(46,42,38,.18)}

/* Card sovrapposta al palco */
.spend-overlap{
  margin-top:-38px;
  position:relative;
  z-index:3;
  box-shadow:0 14px 32px rgba(46,42,38,.11), 0 3px 8px rgba(46,42,38,.05);
}

/* 2. ANIMAZIONI SALVADANAIO & MONETE CHE CADONO */
.piggy-svg{animation:piggyFloat 3.6s ease-in-out infinite;transform-origin:50% 85%}
.piggy-coin{animation:coinDrop 3.6s ease-in-out infinite;transform-origin:99px 18px}
.piggy-bounce .piggy-svg{animation:piggyPop .68s cubic-bezier(.34,1.56,.64,1)!important}
.coin-burst{position:absolute;inset:0;pointer-events:none;z-index:4}
.coin-burst i{
  position:absolute;left:50%;top:-18px;width:30px;height:30px;margin-left:-15px;
  animation:coinBurst var(--cdur,.72s) cubic-bezier(.45,.05,.75,.85) var(--cdel,0s) forwards;
}
.deco{position:absolute;pointer-events:none}
.deco-float{animation:decoBob 4.2s ease-in-out infinite}
.deco-float.d2{animation-delay:-1.4s}
.deco-float.d3{animation-delay:-2.7s}

/* 6. TASTI RAPIDI COLORATI PER CATEGORIA */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.qbtn{
  min-height:92px;border:0;border-radius:22px;
  background:var(--qbg, var(--card));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  box-shadow:var(--shadow-sm);padding:10px 6px;text-align:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.qbtn .qico{
  width:40px;height:40px;border-radius:15px;
  background:rgba(255,255,255,.78);
  display:flex;align-items:center;justify-content:center;
  color:var(--qink, var(--ink));
  box-shadow:0 2px 6px rgba(46,42,38,.06);
}
.qbtn svg{width:22px;height:22px;flex:none}
.qbtn b{font-size:14.5px;font-weight:800;line-height:1.15;color:var(--text)}
.qbtn span{font-size:13px;font-weight:800;color:var(--text2)}
.qbtn.add{background:rgba(255,255,255,.65);border:2.5px dashed var(--ink);box-shadow:none;color:var(--ink)}
.qbtn.add .qico{background:transparent;box-shadow:none}
.qbtn:active{transform:scale(.92)}

.ring{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:52px;height:52px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:14.5px;color:var(--text)}

/* Liste */
.list{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.item{
  width:100%;min-height:62px;border:0;border-bottom:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;gap:12px;
  padding:12px 18px;text-align:left;transition:background .15s;
}
.item:active{background:var(--soft)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .grow b{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.dot{
  width:42px;height:42px;border-radius:16px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:700;font-size:16px;color:var(--text);
}
.amt{font-family:var(--head);font-weight:600;font-size:18px;white-space:nowrap;color:var(--text)}

/* Consigli & Box caldi */
.tip{
  background:#FFF0CE;border-radius:22px;padding:15px 18px;
  display:flex;gap:12px;align-items:flex-start;margin:14px 0;
}
.tip svg{flex:none;width:24px;height:24px;margin-top:1px}
.tip p{margin:0;font-size:15px;font-weight:700;line-height:1.45;color:var(--text)}
.tip.warn{background:var(--warnbg)}
.tip.help{background:#E3F4F7}

/* Bottoni */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:56px;border:0;border-radius:999px;
  background:var(--lv);color:var(--text);
  font-family:var(--head);font-weight:700;font-size:18px;
  box-shadow:0 6px 16px rgba(46,42,38,.12);margin-top:14px;padding:0 20px;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:var(--card);color:var(--text);
  font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;
  box-shadow:var(--shadow-sm);
}
.btn.line{
  background:rgba(255,255,255,.6);box-shadow:none;
  border:2.5px dashed var(--ink);color:var(--ink);
  font-family:'Nunito',sans-serif;font-weight:800;font-size:15.5px;min-height:50px;
}
.btn.danger{
  background:var(--warnbg);color:var(--warn);
  font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;box-shadow:none;
}
.link{border:0;background:none;color:var(--ink);font-weight:800;text-decoration:underline;font-size:16px;min-height:46px;padding:0 8px}
.mini{
  min-height:44px;border:0;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow-sm);
  padding:0 16px;font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.mini:active{transform:scale(.95)}

/* Campi form */
label.f{display:block;font-size:14.5px;font-weight:800;color:var(--text2);margin:14px 0 6px}
input.in,select.in,textarea.in{
  width:100%;min-height:52px;border:2px solid transparent;border-radius:18px;
  background:var(--soft);padding:0 16px;font-size:17px;font-weight:700;color:var(--text);
  transition:border-color .15s, background .15s;
}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--ink);background:#fff;outline:0}
.money{
  display:flex;align-items:center;background:var(--card);border-radius:22px;
  height:72px;padding:0 20px;box-shadow:var(--shadow-sm);
}
.money input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--head);font-weight:700;font-size:34px;outline:0;color:var(--text)}
.money span{font-family:var(--head);font-weight:700;font-size:30px;color:var(--ink)}
.sheet .money{background:var(--soft);box-shadow:none}

/* Chip & Segmenti */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  min-height:44px;padding:0 16px;border-radius:999px;
  border:0;background:var(--card);box-shadow:var(--shadow-sm);
  font-weight:800;font-size:15px;color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  transition:transform .15s, background .15s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--lv);color:var(--text);box-shadow:0 4px 10px rgba(46,42,38,.12)}
.sheet .chip{background:var(--soft);box-shadow:none}
.sheet .chip.on{background:var(--lv)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{
  min-height:64px;border-radius:22px;border:0;background:var(--card);
  font-weight:800;font-size:16px;padding:12px;box-shadow:var(--shadow-sm);color:var(--text);
  transition:transform .15s, background .15s;
}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--lv);box-shadow:0 4px 12px rgba(46,42,38,.12)}
.sheet .opt{background:var(--soft);box-shadow:none}
.sheet .opt.on{background:var(--lv)}

/* Barra in basso */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:28px 28px 0 0;
  box-shadow:0 -6px 24px rgba(46,42,38,.08);
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.tabs button{
  min-height:54px;border:0;border-radius:18px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text2);font-weight:800;font-size:12.5px;
  transition:background .18s, color .18s, transform .15s;
}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--text);background:color-mix(in srgb, var(--lv) 32%, var(--cream))}
nav.tabs button:active{transform:scale(.94)}

/* 3. TRAGUARDI: SENTIERO A ZIG-ZAG CON TAPPE TONDE */
.trail{position:relative;margin-top:16px;padding:6px 0}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.trail-nodes{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.tnode{display:flex;align-items:center;gap:14px}
.tnode.left{flex-direction:row;padding-right:18px}
.tnode.right{flex-direction:row-reverse;padding-left:18px;text-align:right}
.tnode.right .tinfo{align-items:flex-end}
.tbadge-wrap{position:relative;width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center}
.tbadge{
  width:64px;height:64px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:700;font-size:20px;color:var(--text);
  box-shadow:0 6px 16px rgba(46,42,38,.12), inset 0 -3px 0 rgba(46,42,38,.12);
  border:3.5px solid #FFFFFF;
}
.tbadge.ghost{background:#FFF8EE!important;border:3px dashed #B5A99B;box-shadow:none}
.tbadge.locked{background:#EAE1D4!important;color:var(--text2);box-shadow:none}
.tbadge .tsub{font-size:10px;font-weight:800;line-height:1;margin-top:1px}
.tpiggy{
  position:absolute;top:-22px;right:-10px;z-index:2;
  filter:drop-shadow(0 4px 6px rgba(46,42,38,.16));
  animation:piggyFloat 3s ease-in-out infinite;
}
.tinfo{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;
  background:rgba(255,255,255,.78);padding:12px 15px;border-radius:20px;
  box-shadow:0 3px 10px rgba(46,42,38,.04);
}
.tnode.here .tinfo{background:var(--card);box-shadow:var(--shadow)}
.tinfo b{font-family:var(--head);font-size:17px;font-weight:600;color:var(--text);line-height:1.2}

.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{
  background:var(--card);border-radius:22px;padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  border:0;box-shadow:var(--shadow-sm);min-height:112px;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.medal:active{transform:scale(.94)}
.medal b{font-size:13.5px;font-weight:800;line-height:1.2;color:var(--text)}
.medal.off{opacity:.72;background:rgba(255,255,255,.68);box-shadow:none}
.disc{font-size:14px;font-weight:700;color:var(--text2);text-align:center;margin:18px 10px 0}

/* Modali (Bottom Sheet) */
.backdrop{
  position:fixed;inset:0;background:rgba(46,42,38,.38);backdrop-filter:blur(2px);
  z-index:20;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .2s;cursor:pointer;
}
.backdrop.show{opacity:1}
.sheet{
  position:relative;cursor:auto;
  width:100%;max-width:520px;max-height:92vh;overflow:auto;
  background:var(--card);border-radius:30px 30px 0 0;
  padding:12px 22px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(32px);transition:transform .24s cubic-bezier(.22,1,.36,1);
}
.backdrop.show .sheet{transform:none}
.sx{position:sticky;top:0;float:right;margin:-2px -6px 0 8px;z-index:2;background:var(--soft)!important;box-shadow:none!important}
.grab{width:46px;height:5px;border-radius:3px;background:rgba(46,42,38,.16);margin:4px auto 12px}
.sheet h3{font-family:var(--head);font-weight:600;font-size:25px;margin:4px 0 6px;color:var(--text)}

/* Toast & Coriandoli */
.toast{width:max-content;
  position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--cream);
  padding:13px 18px;border-radius:20px;font-weight:700;font-size:15px;
  box-shadow:0 10px 26px rgba(46,42,38,.22);
  z-index:30;opacity:0;transition:.22s;display:flex;align-items:center;gap:14px;max-width:92vw;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:var(--gold);font-weight:800;text-decoration:underline;min-height:36px;padding:0}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{
  position:absolute;top:-16px;width:11px;height:11px;border-radius:3px;
  animation:confFall var(--dur,1.9s) cubic-bezier(.2,.7,.4,1) forwards;
}

/* Primo avvio */
.ob{
  max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;
  padding:calc(env(safe-area-inset-top) + 16px) 22px calc(28px + env(safe-area-inset-bottom));
}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.steps i{height:8px;border-radius:999px;background:rgba(46,42,38,.12);transition:background .25s}
.steps i.on{background:var(--lv)}
.ob h1{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.2;margin:0;color:var(--text)}
.ob .push{margin-top:auto}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.stack{display:flex;height:18px;border-radius:999px;overflow:hidden;background:rgba(46,42,38,.08);margin:12px 0 8px;gap:2px}
.stack>i{display:block;height:100%;border-radius:4px}

<script>
(() => {
"use strict";

/* =========================================================
   CIPIGNOLO – fai contare i tuoi soldi
   App gratuita, senza server: i dati restano nel browser.
   Non è consulenza finanziaria.
   ========================================================= */

const KEY = "cipignolo-v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur0 = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", maximumFractionDigits:0, useGrouping:"always"});
const eur2 = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:"always"});
const fmt = n => eur0.format(Math.round(n || 0));
const fmt2 = n => eur2.format(n || 0);
const pct = n => Math.round(n) + "%";
const dec = n => String(Math.round(n * 10) / 10).replace(".", ",");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((parse(iso(b)) - parse(iso(a))) / 864e5);
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (base, k) => { const t = base.getMonth() + k, y = base.getFullYear() + Math.floor(t / 12), m = ((t % 12) + 12) % 12; return new Date(y, m, Math.min(base.getDate(), dim(y, m))); };
const meseDi = d => ({ a:new Date(d.getFullYear(), d.getMonth(), 1), b:new Date(d.getFullYear(), d.getMonth() + 1, 0) });
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MESI_B = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const dataBreve = d => `${d.getDate()} ${MESI_B[d.getMonth()]}${d.getFullYear() !== today().getFullYear() ? " " + d.getFullYear() : ""}`;
const meseAnno = d => `${MESI_B[d.getMonth()]} ${d.getFullYear()}`;
const num = v => { const s = String(v ?? "").trim().replace(/\s|€/g, ""); if (!s) return 0; const n = parseFloat(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s); return isFinite(n) ? n : 0; };
const numOrNull = v => String(v ?? "").trim() === "" ? null : num(v);
const sum = (a, f = x => x) => (a || []).reduce((t, x) => t + (+f(x) || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lista = a => a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " e " + a[a.length - 1];

/* ---------- livelli e colori ---------- */
const LEVELS = [
  { n:"Punto di partenza", d:"Sai dove vanno i tuoi soldi", lv:"#E6DDD0", ink:"#5E5247", piggy:"#FFF8EE", ghost:true },
  { n:"Respiro", d:"Il mese si chiude senza andare in rosso", lv:"#F9A8C9", ink:"#96335C", piggy:"#F9A8C9" },
  { n:"Cuscinetto", d:"Fondo pari a 1 mese di spese", lv:"#FF8A7A", ink:"#9E3426", piggy:"#FF8A7A" },
  { n:"Via i debiti cari", d:"Niente più debiti sopra il 10%", lv:"#B79CED", ink:"#553994", piggy:"#B79CED" },
  { n:"Rate leggere", d:"Rate sotto il 15% delle entrate", lv:"#7CC4F2", ink:"#19608C", piggy:"#7CC4F2" },
  { n:"Fondo pieno", d:"3 mesi di spese da parte", lv:"#5BC98C", ink:"#1A663D", piggy:"#5BC98C" },
  { n:"Obiettivi", d:"Risparmi per qualcosa di tuo", lv:"#C9CFD6", ink:"#434E5C", piggy:"#C9CFD6" },
  { n:"Testa dura", d:"Tutto mantenuto per 6 mesi", lv:"#F5C542", ink:"#7D5200", piggy:"#F5C542" }
];
const MSG = [
  "Benvenuto! Prima vediamo dove vanno i soldi.",
  "Un passo alla volta: stai andando bene.",
  "Il cuscinetto c'è. Ora tocca agli interessi.",
  "Addio interessi! Bel colpo.",
  "Rate leggere: si respira di più.",
  "Fondo pieno: gli imprevisti fanno meno paura.",
  "Testa dura! Manca pochissimo all'oro.",
  "Ce l'hai fatta. Che testa dura!"
];

/* ---------- categorie, tasti rapidi, voci fisse ---------- */
const DEF_CATS = ["Spesa","Bar e colazioni","Sigarette","Benzina","Pranzi e cene","Salute","Svago","Varie"];
const RAPIDI_CATALOGO = [
  { nome:"Caffè", tipo:"fisso", prezzo:1.2, cat:"Bar e colazioni" },
  { nome:"Cornetto", tipo:"fisso", prezzo:1.0, cat:"Bar e colazioni" },
  { nome:"Colazione", tipo:"fisso", prezzo:3.0, cat:"Bar e colazioni" },
  { nome:"Sigarette", tipo:"chiedi", prezzo:null, cat:"Sigarette" },
  { nome:"Ricarica", tipo:"chiedi", prezzo:null, cat:"Varie" },
  { nome:"Parcheggio", tipo:"chiedi", prezzo:null, cat:"Varie" },
  { nome:"Spesa", tipo:"libero", prezzo:null, cat:"Spesa" },
  { nome:"Benzina", tipo:"libero", prezzo:null, cat:"Benzina" },
  { nome:"Pranzo fuori", tipo:"libero", prezzo:null, cat:"Pranzi e cene" },
  { nome:"Farmacia", tipo:"libero", prezzo:null, cat:"Salute" },
  { nome:"Animali", tipo:"libero", prezzo:null, cat:"Varie" },
  { nome:"Svago", tipo:"libero", prezzo:null, cat:"Svago" }
];
const CAT_TINT = ["#FFD9C8","#D3F2E1","#E6DCFA","#CEEBF9","#FDE0EC","#FFF0C2","#E2E7ED","#F6E2D5"];
const CAT_STYLE = {
  "Spesa":          { bg:"#DCF5E7", ink:"#1E6E43" },
  "Bar e colazioni":{ bg:"#FFE3D3", ink:"#9E471C" },
  "Sigarette":      { bg:"#EBE2FA", ink:"#5C4099" },
  "Benzina":        { bg:"#D8EEFC", ink:"#1F6896" },
  "Pranzi e cene":  { bg:"#FFE8CC", ink:"#965314" },
  "Salute":         { bg:"#FCE0EC", ink:"#9E3B65" },
  "Svago":          { bg:"#FFF1C4", ink:"#855B00" },
  "Varie":          { bg:"#E6EBF0", ink:"#4A5563" }
};
const catStyle = cat => CAT_STYLE[cat] || { bg:"#F2E7D8", ink:"#5A4F47" };

const FREQ = [[1,"Ogni mese"],[2,"Ogni 2 mesi"],[3,"Ogni 3 mesi"],[4,"Ogni 4 mesi"],[6,"Ogni 6 mesi"],[12,"Ogni anno"]];
const freqTxt = f => ({1:"ogni mese",2:"ogni 2 mesi",3:"ogni 3 mesi",4:"ogni 4 mesi",6:"ogni 6 mesi",12:"ogni anno"})[f] || `ogni ${f} mesi`;
const CASA_SUGG = [["Affitto",1],["Luce",2],["Gas",2],["Acqua",3],["Internet",1],["Rifiuti (TARI)",4],["Condominio",1]];
const ABB_SUGG = [["Telefono",1],["Netflix",1],["Spotify",1],["Amazon Prime",12],["Disney+",1],["Palestra",1],["iCloud",1]];
const freqDi = (nome, sugg) => (sugg.find(([n]) => n.toLowerCase() === String(nome).toLowerCase()) || [0, 1])[1];
const dataDefault = () => { const t = today(); return iso(new Date(t.getFullYear(), t.getMonth() + 1, 15)); };

const HABITS = [
  "Voglia di una sigaretta in più? Aspetta 5 minuti e bevi un bicchiere d'acqua.",
  "Voglia di comprare online? Metti nel carrello e aspetta 48 ore.",
  "Conta in ore di lavoro: dividi una spesa per quanto guadagni in un'ora.",
  "Il budget è un permesso, non un divieto.",
  "Festeggia i traguardi: un debito chiuso, un fondo pieno.",
  "Prelievo fisso il lunedì, controllo di 5 minuti la domenica."
];

/* ---------- stato ---------- */
function blank() {
  return {
    v:2, setup:false, setupAt:null, modo:"solo",
    nick:{ p1:"Io", p2:"Partner" }, chiAttivo:"p1",
    entrate:{ tipo:"fisso", importo:0, importo2:0, giorno:23, giorno2:23 },
    budgetMensile:null, budgetPers:{ p1:null, p2:null },
    casa:[], abbonamenti:[], debiti:[], fisse:[],
    fondo:{ saldo:0, prima:null },
    categorie:DEF_CATS.slice(),
    rapidi:[], spese:[], obiettivi:[], scadenze:[], extra:[],
    livello:{ max:0, date:{} },
    medaglie:{}, ultimoBackup:null
  };
}
function migra(s) {
  const b = blank();
  s = Object.assign(b, s);
  s.nick = Object.assign({ p1:"Io", p2:"Partner" }, s.nick || {});
  s.budgetPers = Object.assign({ p1:null, p2:null }, s.budgetPers || {});
  if (s.entrate.giorno2 == null) s.entrate.giorno2 = s.entrate.giorno;
  if ((s.fisse || []).length) {
    const t = today(), d1 = iso(new Date(t.getFullYear(), t.getMonth(), 1));
    s.fisse.forEach(f => {
      const abb = /abbonament/i.test(f.nome);
      (abb ? s.abbonamenti : s.casa).push({ id:f.id || uid(), nome: abb && f.nome === "Abbonamenti" ? "Abbonamenti (totale)" : f.nome, importo:+f.importo || 0, freq:1, data:d1, chi:"ins" });
    });
    s.fisse = [];
  }
  s.debiti.forEach(d => { if (!d.chi) d.chi = "ins"; });
  s.v = 2;
  return s;
}
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migra(JSON.parse(raw)); } catch (e) {}
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Non riesco a salvare sul telefono"); }
}

/* ---------- coppia ---------- */
const coppia = () => S.modo === "coppia";
const nomeChi = k => k === "p2" ? S.nick.p2 : k === "ins" ? "Insieme" : S.nick.p1;
const CHI = () => [["p1", S.nick.p1], ["p2", S.nick.p2], ["ins", "Insieme"]];
const chiDi = s => coppia() ? (s.chi || "ins") : "p1";
const chiChips = (sel, attr = "data-chi") => `<div class="chi3">${CHI().map(([k, l]) => `<button type="button" class="chip sm ${sel === k ? "on" : ""}" ${attr}="${k}" aria-pressed="${sel === k}">${esc(l)}</button>`).join("")}</div>`;

/* ---------- voci che si ripetono ---------- */
function occIn(v, a, b) {
  if (!v.data) return null;
  const base = parse(v.data), f = Math.max(1, +v.freq || 1);
  const diff = (a.getFullYear() - base.getFullYear()) * 12 + a.getMonth() - base.getMonth();
  const k0 = Math.floor(diff / f);
  for (let k = k0 - 1; k <= k0 + 1; k++) { const d = addMonths(base, k * f); if (d >= a && d <= b) return d; }
  return null;
}
function prossima(v, dal = today()) {
  if (!v.data) return null;
  const base = parse(v.data), f = Math.max(1, +v.freq || 1);
  const diff = (dal.getFullYear() - base.getFullYear()) * 12 + dal.getMonth() - base.getMonth();
  let k = Math.floor(diff / f) - 1, d;
  do { d = addMonths(base, k * f); k++; } while (d < dal);
  return d;
}
const uscitaIn = (l, m) => sum(l, v => occIn(v, m.a, m.b) ? +v.importo : 0);
const mediaMese = l => sum(l, v => (+v.importo || 0) / Math.max(1, +v.freq || 1));
const fisseMese = m => uscitaIn(S.casa, m) + uscitaIn(S.abbonamenti, m);
const fisseMedia = () => mediaMese(S.casa) + mediaMese(S.abbonamenti);
const voci = () => [...S.casa.map(v => ({ ...v, k:"casa" })), ...S.abbonamenti.map(v => ({ ...v, k:"abb" }))];

/* ---------- debiti ---------- */
const aRate = d => d.tipo === "mutuo" || d.tipo === "prestito";
function nRateDa(fine, dal) {
  const f = parse(fine);
  return Math.max(0, (f.getFullYear() - dal.getFullYear()) * 12 + f.getMonth() - dal.getMonth() + (f.getDate() >= dal.getDate() ? 1 : 0));
}
const annuita = (r, n) => r > 0 ? (1 - Math.pow(1 + r, -n)) / r : n;
function trovaTasso(P, R, n) {
  if (!(P > 0 && R > 0 && n > 0)) return null;
  if (R * n <= P) return 0;
  let lo = 0, hi = 0.1;
  if (R * annuita(hi, n) > P) return hi;
  for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (R * annuita(mid, n) > P) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function info(d) {
  const R = +d.rata || 0;
  if (aRate(d)) {
    if (!d.fine) {
      const v = d.residuo ?? d.saldo, saldo = v != null && v !== "" ? +v || 0 : null, tasso = d.tasso ?? null;
      return { aRate:true, senzaFine:true, n:null, R, saldo, eff:saldo || 0, tasso, r:tasso != null ? tasso / 1200 : null, chiuso: !!d.chiuso || (saldo != null && saldo <= 0) };
    }
    const n = nRateDa(d.fine, today()), chiuso = !!d.chiuso || n === 0;
    let r = null, saldo = null, N = null, incoerente = false;
    if (+d.residuo > 0) {
      const n0 = nRateDa(d.fine, d.residuoData ? parse(d.residuoData) : today());
      r = trovaTasso(+d.residuo, R, n0); incoerente = R * n0 < +d.residuo * 0.98;
    } else if (+d.importo > 0 && d.inizio) {
      N = nRateDa(d.fine, parse(d.inizio)); r = trovaTasso(+d.importo, R, N); incoerente = R * N < +d.importo * 0.98;
    }
    if (r != null) saldo = chiuso ? 0 : R * annuita(r, n);
    const totRate = chiuso ? 0 : R * n;
    return { aRate:true, n, N, R, r, tasso: r != null ? Math.round(r * 1200 * 100) / 100 : null, stimato:true, saldo, totRate,
      eff: saldo != null ? saldo : totRate, chiuso, incoerente,
      intRata: saldo != null ? saldo * r : null, intTot: saldo != null ? Math.max(0, totRate - saldo) : null };
  }
  const saldo = +d.saldo || 0, tasso = d.tasso ?? null;
  return { aRate:false, R, saldo, eff:saldo, tasso, r: tasso != null ? tasso / 1200 : null, chiuso: saldo <= 0 };
}
const debitiAttivi = () => S.debiti.filter(d => !info(d).chiuso);
const rateTot = () => sum(debitiAttivi(), d => d.rata);
const rateNoMutuo = () => sum(debitiAttivi().filter(d => d.tipo !== "mutuo"), d => d.rata);
const isCaro = d => { const i = info(d); return !i.chiuso && i.tasso != null && i.tasso > 10; };
const debitiCari = () => S.debiti.filter(isCaro);
const interessiMese = d => { const i = info(d); return (i.eff || 0) * (i.r || 0); };
const cartaSenzaTasso = () => S.debiti.find(d => !aRate(d) && d.tipo === "carta" && !info(d).chiuso && d.tasso == null);
const ordineDebiti = () => S.debiti.slice().sort((a, b) => {
  const ia = info(a), ib = info(b);
  if (ia.chiuso !== ib.chiuso) return ia.chiuso ? 1 : -1;
  if ((a.tipo === "mutuo") !== (b.tipo === "mutuo")) return a.tipo === "mutuo" ? 1 : -1;
  return (ib.tasso ?? -1) - (ia.tasso ?? -1);
});
function mesiCarta(d) {
  const S0 = +d.saldo || 0, R = +d.rata || 0; if (S0 <= 0) return 0; if (R <= 0) return null;
  const r = (+d.tasso || 0) / 1200;
  if (r > 0) { if (R <= S0 * r) return Infinity; return Math.ceil(-Math.log(1 - r * S0 / R) / Math.log(1 + r)); }
  return Math.ceil(S0 / R);
}
function meseFra(n) { const d = today(); d.setDate(1); d.setMonth(d.getMonth() + n - 1); return `${MESI[d.getMonth()]} ${d.getFullYear()}`; }

/* ---------- entrate e budget ---------- */
const entrate = () => (+S.entrate.importo || 0) + (coppia() ? (+S.entrate.importo2 || 0) : 0);
const budgetAuto = fisse => Math.max(0, Math.floor((entrate() - fisse - rateTot()) * 0.9 / 5) * 5);
const budgetMeseDi = m => S.budgetMensile == null ? budgetAuto(fisseMese(m)) : +S.budgetMensile;
const meseCorrente = () => meseDi(today());
const budgetMese = () => budgetMeseDi(meseCorrente());
const budgetSuggerito = () => budgetAuto(fisseMese(meseCorrente()));
const budgetSettDi = ws => { const m = meseDi(addDays(ws, 3)); return budgetMeseDi(m) * 7 / m.b.getDate(); };
const budgetSett = () => budgetSettDi(weekStart(today()));
const budgetMedio = () => S.budgetMensile == null ? budgetAuto(fisseMedia()) : +S.budgetMensile;
const speseMese = () => fisseMedia() + rateTot() + budgetMedio();
const avanzo = () => entrate() - speseMese();
const mesiTarget = () => S.entrate.tipo === "variabile" ? 6 : 3;
const fondoMesi = () => speseMese() > 0 ? S.fondo.saldo / speseMese() : 0;
function budgetPersona(k, bs) {
  if (!coppia()) return k === "p1" ? bs : 0;
  const b1 = +S.budgetPers.p1 || 0, b2 = +S.budgetPers.p2 || 0;
  if (k === "p1") return b1 || null; if (k === "p2") return b2 || null;
  return b1 || b2 ? Math.max(0, bs - b1 - b2) : null;
}

const speseIn = (a, b) => { const A = iso(a), B = iso(b); return S.spese.filter(s => s.data >= A && s.data <= B); };
const settimana = off => { const s = addDays(weekStart(today()), off * 7); return { a:s, b:addDays(s, 6) }; };

function criteri() {
  const e = entrate(), sm = speseMese();
  return [
    true,
    e > 0 && avanzo() >= 0,
    sm > 0 && S.fondo.saldo >= sm,
    debitiCari().length === 0 && !cartaSenzaTasso(),
    e > 0 && rateNoMutuo() <= e * 0.15,
    sm > 0 && S.fondo.saldo >= sm * mesiTarget(),
    S.obiettivi.some(o => (+o.saldo || 0) > 0),
    !!S.livello.date[6] && daysBetween(parse(S.livello.date[6]), today()) >= 180
  ];
}
function candidato() { const c = criteri(); let k = 0; for (let i = 1; i < c.length; i++) { if (c[i]) k = i; else break; } return k; }

function progresso(k) {
  const e = entrate(), sm = speseMese();
  switch (k) {
    case 1: { const m = -avanzo(); return { p: e > 0 && sm > 0 ? clamp(e / sm * 100, 0, 99) : 0, h: m > 0 ? `Mancano ${fmt(m)} al mese per chiudere in pari` : "Ci sei quasi" }; }
    case 2: { const m = sm - S.fondo.saldo; return { p: sm > 0 ? clamp(S.fondo.saldo / sm * 100, 0, 100) : 0, h: `Ti mancano ${fmt(Math.max(0, m))} per il Cuscinetto` }; }
    case 3: { const c = debitiCari(); const tot = sum(c, d => info(d).eff), ini = sum(c, d => d.saldoIniziale || info(d).eff);
      const senza = cartaSenzaTasso();
      if (!c.length && senza) return { p: 50, h: `Scrivi il tasso di ${senza.nome} per capire se è caro` };
      return { p: ini > 0 ? clamp((1 - tot / ini) * 100, 0, 100) : 0, h: c.length === 1 ? `${c[0].nome}: restano ${fmt(tot)}` : `Debiti cari: restano ${fmt(tot)}` }; }
    case 4: { const r = e > 0 ? rateNoMutuo() / e * 100 : 0; return { p: r > 0 ? clamp(15 / r * 100, 0, 100) : 100, h: `Rate al ${pct(r)}, obiettivo 15%` }; }
    case 5: { const m = fondoMesi(); return { p: clamp(m / mesiTarget() * 100, 0, 100), h: `Fondo a ${dec(m)} mesi su ${mesiTarget()}` }; }
    case 6: return { p: S.obiettivi.length ? 50 : 0, h: S.obiettivi.length ? "Metti qualcosa nel tuo obiettivo" : "Scegli il tuo primo obiettivo" };
    case 7: { const d = S.livello.date[6] ? daysBetween(parse(S.livello.date[6]), today()) : 0; return { p: clamp(d / 180 * 100, 0, 100), h: `Ancora ${Math.max(0, Math.ceil((180 - d) / 30))} mesi così e il Cipignolo è d'oro` }; }
    default: return { p: 100, h: "Cipignolo d'oro: mantieni il ritmo" };
  }
}

/* ---------- medaglie ---------- */
function settimanePassate() {
  if (!S.spese.length) return [];
  const first = S.spese.reduce((m, s) => s.data < m ? s.data : m, S.spese[0].data);
  const out = []; let w = weekStart(parse(first)); const cur = weekStart(today());
  while (w < cur) { const b = addDays(w, 6); const sp = speseIn(w, b); out.push({ a:w, spese:sp, tot:sum(sp, s => s.importo), bs:budgetSettDi(w), attiva:sp.length > 0 }); w = addDays(w, 7); }
  return out;
}
function serieGiorni() {
  const days = [...new Set(S.spese.map(s => s.data))].sort(); let best = 0, run = 0, prev = null;
  days.forEach(d => { run = prev && daysBetween(parse(prev), parse(d)) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return best;
}
const SFIDE = [
  { t:"Almeno 3 giorni senza spese al bar", ok: sp => { const giorniBar = new Set(sp.filter(s => /bar|colazion|caff/i.test(s.cat + " " + (s.nome || ""))).map(s => s.data)); return 7 - giorniBar.size >= 3; } },
  { t:"Almeno 2 giorni senza nessuna spesa", ok: sp => 7 - new Set(sp.map(s => s.data)).size >= 2 },
  { t:"Chiudi la settimana sotto budget", ok: (sp, a) => sum(sp, s => s.importo) <= budgetSettDi(a) }
];
const sfidaDi = d => SFIDE[Math.floor(weekStart(d).getTime() / (7 * 864e5)) % SFIDE.length];
const sotto = w => w.attiva && w.tot <= w.bs;

const MEDALS = [

function launchConfetti() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const cols = ["#F5C542","#5BC98C","#F9A8C9","#7CC4F2","#B79CED","#FF8A7A"];
  for (let i = 0; i < 34; i++) {
    const p = document.createElement("i");
    p.style.left = (Math.random() * 100) + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = (Math.random() * 0.45) + "s";
    p.style.setProperty("--dur", (1.4 + Math.random() * 0.9) + "s");
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 2600);
}

function check(silent) {
  const t = iso(today()); const news = [];
  S.debiti.forEach(d => { if (isCaro(d)) d.eraCaro = true; });
  const c = candidato();
  if (c > S.livello.max) {
    for (let k = S.livello.max + 1; k <= c; k++) S.livello.date[k] = S.livello.date[k] || t;
    const from = S.livello.max; S.livello.max = c;
    if (!silent && S.setup) setTimeout(() => { launchConfetti(); celebraLivello(c, from); }, 350);
  }
  MEDALS.forEach(m => { if (!S.medaglie[m.id] && m.ok()) { S.medaglie[m.id] = t; news.push(m.n); } });
  save();
  if (!silent && news.length && S.setup) {
    launchConfetti();
    setTimeout(() => toast(`Nuova medaglia: ${news.join(", ")}`), 750);
  }
}
function livelloInPausa() { const c = candidato(); return c < S.livello.max ? c + 1 : 0; }

/* ---------- consigli ---------- */
function consigli() {
  const out = []; const e = entrate();
  const cari = debitiCari().sort((a, b) => info(b).tasso - info(a).tasso);
  if (e > 0 && (avanzo() < -e * 0.1 || rateNoMutuo() > e * 0.4))
    out.push({ k:"help", t:"Se i debiti sono diventati troppo pesanti non sei solo: uno sportello gratuito (associazioni dei consumatori, sportelli anti-usura) può aiutarti a trovare una strada." });
  if (cari.length) { const i = info(cari[0]); out.push({ k:"tip", t:`Chiudi prima ${esc(cari[0].nome)}: al ${String(i.tasso).replace(".", ",")}%${i.stimato ? " (stima)" : ""} ti costa circa ${fmt(interessiMese(cari[0]))} di interessi al mese.` }); }
  const t = today(), next = meseDi(new Date(t.getFullYear(), t.getMonth() + 1, 1));
  const inArrivo = voci().filter(v => (+v.freq || 1) > 1 && occIn(v, next.a, next.b));
  if (inArrivo.length) { const tot = sum(inArrivo, v => v.importo);
    out.push({ k:"tip", t:`A ${MESI[next.a.getMonth()]} arriva${inArrivo.length > 1 ? "no" : ""} ${esc(lista(inArrivo.map(v => v.nome)))} (${fmt(tot)}): quel mese il budget settimanale sarà più basso di circa ${fmt(tot * 7 / next.b.getDate())}.` }); }
  S.abbonamenti.forEach(v => { const p = prossima(v), f = +v.freq || 1; if (!p) return; const gg = daysBetween(t, p);
    if (gg >= 0 && gg <= (f >= 3 ? 14 : 3)) out.push({ k:"tip", t:`${esc(v.nome)} si rinnova ${gg === 0 ? "oggi" : `il ${dataBreve(p)}`} (${fmt2(v.importo)}): lo usi ancora? Se no, è il momento di disdire.` }); });
  const ct = cartaSenzaTasso() || S.debiti.find(d => !aRate(d) && !info(d).chiuso && d.tasso == null);
  if (ct) out.push({ k:"tip", t:`Sai il tasso di ${esc(ct.nome)}? Ci aiuta a capire quale debito chiudere prima. Lo trovi nell'estratto conto o nel contratto.` });
  const sf = S.debiti.find(d => aRate(d) && !d.fine && !info(d).chiuso);
  if (sf) out.push({ k:"tip", t:`Aggiungi la data dell'ultima rata di ${esc(sf.nome)}: la trovi nel contratto o nell'app della banca. Così la data di fine è sempre giusta.` });
  const inc = S.debiti.find(d => aRate(d) && info(d).incoerente);
  if (inc) out.push({ k:"warn", t:`Su ${esc(inc.nome)} i numeri non tornano: rata per rate rimaste fa meno del debito. Controlla la data dell'ultima rata e il residuo.` });
  const sr = S.debiti.find(d => aRate(d) && d.fine && !info(d).chiuso && info(d).saldo == null);
  if (sr) out.push({ k:"tip", t:`Vuoi sapere quanto di ogni rata di ${esc(sr.nome)} va in interessi? Aggiungi il debito residuo che vedi nell'app della banca: il resto lo calcoliamo noi.` });
  if (speseMese() > 0 && fondoMesi() < 1) out.push({ k:"tip", t:`Prima priorità: un fondo pari a 1 mese di spese, cioè ${fmt(speseMese())}.` });
  const m = meseCorrente(); const sp = speseIn(m.a, m.b); const tot = sum(sp, s => s.importo);
  if (tot >= 50) {
    const by = {}; sp.forEach(s => by[s.cat] = (by[s.cat] || 0) + s.importo);
    const [cat, v] = Object.entries(by).sort((a, b) => b[1] - a[1]).find(([c]) => !/^spesa$/i.test(c)) || [];
    if (cat && v / tot > 0.15) {
      if (/bar|colazion/i.test(cat)) out.push({ k:"tip", t:`Il bar pesa il ${pct(v / tot * 100)} delle spese di questo mese. Con 2 caffè al giorno invece di 4 risparmi circa ${fmt(2 * 1.2 * 30)} al mese.` });
      else out.push({ k:"tip", t:`${esc(cat)} pesa il ${pct(v / tot * 100)} delle spese di questo mese. Ridurla di un terzo vale circa ${fmt(v / 3)} al mese.` });
    }
  }
  const w = settimana(0); if (sum(speseIn(w.a, w.b), s => s.importo) > budgetSett() && budgetSett() > 0)
    out.push({ k:"warn", t:"Settimana storta, non piano rovinato: si riparte lunedì." });
  if (S.extra.some(x => !x.diviso && daysBetween(parse(x.data), today()) <= 30))
    out.push({ k:"tip", t:"È arrivato un extra: metà al piano, metà a te. Te lo sei meritato." });
  const p = S.debiti.find(d => d.tipo === "prestito" && !info(d).chiuso && info(d).saldo != null && info(d).saldo > 0 && info(d).saldo < 10000);
  if (p) out.push({ k:"tip", t:`${esc(p.nome)} è sotto i 10.000 €: valuta se chiuderlo in anticipo. Chiedi alla banca il conteggio di estinzione e le eventuali penali.` });
  if (debitiAttivi().some(d => d.tipo !== "mutuo" && d.rata > 0)) out.push({ k:"tip", t:"Evita nuove rate finché non chiudi quelle in corso." });
  return out;
}

let toastT;
function toast(msg, undo) {
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Annulla</button>' : ""}`;
  t.classList.add("show"); clearTimeout(toastT);
  if (undo) $("#undo").onclick = () => { undo(); t.classList.remove("show"); };
  toastT = setTimeout(() => t.classList.remove("show"), undo ? 4500 : 2600);
}
function sheet(html, mount) {
  closeSheet(true);
  const b = document.createElement("div"); b.className = "backdrop"; b.id = "bd";
  b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button type="button" class="ibtn sx" aria-label="Chiudi">${xIco()}</button><div class="grab"></div>${html}</div>`;
  document.body.appendChild(b); requestAnimationFrame(() => b.classList.add("show"));
  b.addEventListener("click", e => { if (e.target === b || e.target.closest(".sx")) closeSheet(); });
  const sh = b.querySelector(".sheet"); let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive:true });
  sh.addEventListener("touchmove", e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; sh.style.transform = dy > 0 ? `translateY(${dy}px)` : ""; }, { passive:true });
  sh.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 90) closeSheet(); else sh.style.transform = ""; });
  document.addEventListener("keydown", escClose);
  mount && mount(b);
  const f = b.querySelector("input:not([type=checkbox]):not([type=date]),select"); if (f) setTimeout(() => f.focus(), 60);
  return b;
}
function escClose(e) { if (e.key === "Escape") closeSheet(); }
function closeSheet(now) { const b = $("#bd"); document.removeEventListener("keydown", escClose); if (!b) return; if (now) { b.remove(); return; } b.classList.remove("show"); setTimeout(() => b.remove(), 200); }

  OB.bollette.filter(b => num(b.importo)).forEach(b => s.casa.push({ id:uid(), nome:b.nome, importo:num(b.importo), freq:+b.freq || 1, data:b.data || dataDefault(), chi:"ins" }));
  OB.abb.filter(a => num(a.importo)).forEach(a => s.abbonamenti.push({ id:uid(), nome:a.nome.trim() || "Abbonamento", importo:num(a.importo), freq:+a.freq || 1, data:a.data || dataDefault(), chi:"ins" }));
  OB.rate.filter(r => num(r.rata)).forEach(r => s.debiti.push({ id:uid(), nome:r.nome.trim() || (r.tipo === "mutuo" ? "Mutuo" : "Prestito"), tipo:r.tipo, rata:num(r.rata), fine:r.fine || null, residuo:null, importo:null, inizio:null, chi:"ins", creato:t }));
  if (num(OB.debiti)) s.debiti.push({ id:uid(), nome:"Carte e debiti", tipo:"carta", saldo:num(OB.debiti), saldoIniziale:num(OB.debiti), tasso:null, rata:0, chi:"ins", creato:t });
  s.fondo.saldo = num(OB.risparmi);
  s.rapidi = RAPIDI_CATALOGO.filter(r => OB.rapidi.has(r.nome)).map(r => ({ ...r, id:uid() }));
  S = s; OB = null;
  S.debiti.forEach(d => d.saldoIniziale = d.saldoIniziale || info(d).eff);
  check(true); save(); VIEW = "home"; render();
  setTimeout(() => { launchConfetti(); celebraLivello(S.livello.max, -1); }, 300);
}

function mappaHtml() {
  const m = meseCorrente(), e = entrate(), casa = uscitaIn(S.casa, m), abb = uscitaIn(S.abbonamenti, m), rate = rateTot();
  const bud = budgetMese(), parte = e - casa - abb - rate - bud;
  const parts = [["Casa", casa, COL.casa], ["Abbonamenti", abb, COL.abb], ["Rate e debiti", rate, COL.rate], ["Tutti i giorni", bud, COL.giorni], ["Da parte", Math.max(0, parte), COL.parte]];
  const tot = Math.max(e, sum(parts, p => p[1])) || 1;
  const row = (l, v, c, sign = "−") => `<button class="mrow" data-tab="${l === "Tutti i giorni" ? "spese" : "piano"}"><i class="sw" style="background:${c}"></i><span class="grow">${l}</span><span>${sign} ${fmt(v)}</span></button>`;
  return `<h2 class="s">Mappa dei soldi <span class="small" style="font-size:14.5px">${MESI[m.a.getMonth()]}</span></h2>
  <div class="card">
    <div class="row" style="font-weight:800"><span>Entrate del mese</span><span class="mid" style="font-size:24px">${fmt(e)}</span></div>
    <div class="stack" aria-hidden="true">${parts.filter(p => p[1] > 0).map(p => `<i style="width:${p[1] / tot * 100}%;background:${p[2]}"></i>`).join("")}</div>
    ${row("Casa", casa, COL.casa)}${row("Abbonamenti", abb, COL.abb)}${row("Rate e debiti", rate, COL.rate)}
    ${parte >= 0 ? row("Da parte", parte, COL.parte) : ""}
    <div class="mrow tot"><i class="sw" style="background:${COL.giorni}"></i><span class="grow">Per tutti i giorni</span><span>${fmt(bud)}</span></div>
    <p class="small" style="margin:6px 0 0">Circa ${fmt(budgetSett())} a settimana${fisseMese(m) > fisseMedia() + 1 ? `. Questo mese ci sono bollette o rinnovi in più: per questo è più basso` : ""}.</p>
    ${parte < 0 ? `<div class="tip warn" style="margin-bottom:0">${ico("bulb", "var(--warn)")}<p>Questo mese le uscite superano le entrate di ${fmt(-parte)}. Guardiamo insieme il Piano: un passo alla volta.</p></div>` : ""}
  </div>`;
}

function inArrivoHtml() {
  const t = today(), lim = addDays(t, 30);
  const l = voci().map(v => ({ v, d:prossima(v) })).filter(x => x.d && x.d <= lim).sort((a, b) => a.d - b.d).slice(0, 4);
  const rr = debitiAttivi().filter(d => d.rata > 0 && aRate(d) && d.fine).map(d => { const f = parse(d.fine); let x = new Date(t.getFullYear(), t.getMonth(), Math.min(f.getDate(), dim(t.getFullYear(), t.getMonth()))); if (x < t) x = addMonths(x, 1); return { v:{ nome:d.nome, importo:d.rata, k:"rate" }, d:x }; }).filter(x => x.d <= lim);
  const all = [...l, ...rr].sort((a, b) => a.d - b.d).slice(0, 5);

  return `<h2 class="s">In arrivo</h2><div class="list">${all.map(({ v, d }) => `<button class="item" data-tab="piano"><div class="dot" style="background:${v.k === "casa" ? "#FFD9C8" : v.k === "abb" ? "#E6DCFA" : "#CEEBF9"};font-size:14px;flex-direction:column;line-height:1.05"><b>${d.getDate()}</b><span style="font-size:10px;text-transform:uppercase">${MESI_B[d.getMonth()]}</span></div><div class="grow"><b>${esc(v.nome)}</b><span class="small">${v.k === "casa" ? "Casa" : v.k === "abb" ? "Abbonamento" : "Rata"}</span></div><span class="amt">${fmt2(v.importo)}</span></button>`).join("")}</div>`;

function tipHtml(c) {

function backupReminder() {

  ${cats.length ? `<h2 class="s">Dove sono andati${coppia() && FILTRO !== "tutti" ? ` <span class="small" style="font-size:14px">${esc(nomeChi(FILTRO))} · ${fmt2(fSpent)}</span>` : ""}</h2><div class="card">${cats.map(([c, v], i) => `<div style="margin:8px 0 12px"><div class="row" style="font-weight:800;font-size:15px"><span>${esc(c)}</span><span>${fmt2(v)}</span></div><div class="bar thin" style="margin-top:5px"><i style="width:${fSpent ? v / fSpent * 100 : 0}%;background:${["#5BC98C","#FF8A7A","#B79CED","#7CC4F2","#F9A8C9","#F5C542","#9AA6B2","#C9BCC2"][i % 8]}"></i></div></div>`).join("")}</div>` : ""}

function debitoCard(d, i, evidenzia) {
  const x = info(d), chiuso = x.chiuso, ini = d.saldoIniziale || x.eff;
  let sotto = "", fine = "", restano = "", barra = 0;
  if (x.aRate) {
    sotto = `Rata ${fmt(x.R)}${x.n != null && !chiuso ? ` · ${x.n} rate rimaste` : ""}${x.tasso != null && x.tasso > 0 ? ` · tasso stimato ${String(x.tasso).replace(".", ",")}%` : ""}`;
    fine = chiuso ? "Chiuso!" : x.senzaFine ? "Aggiungi l'ultima rata" : `Ultima rata ${meseAnno(parse(d.fine))}`;
    restano = chiuso ? "Pagato tutto" : x.saldo != null ? `Restano ${fmt(x.saldo)}` : x.totRate ? `Restano ${fmt(x.totRate)} in rate` : "Tocca per completare";
    barra = chiuso ? 100 : x.N ? (1 - x.n / x.N) * 100 : +d.importo > 0 && x.saldo != null ? (1 - x.saldo / d.importo) * 100 : null;
  } else {
    const n = mesiCarta(d);
    sotto = `${d.tasso == null ? "Tasso da inserire" : `Tasso ${String(d.tasso).replace(".", ",")}%`}${d.rata ? ` · rata ${fmt(d.rata)}` : ""}${isCaro(d) ? ` · circa ${fmt(interessiMese(d))} di interessi al mese` : ""}`;
    fine = chiuso ? "Chiuso!" : n === null ? "Rata libera" : n === Infinity ? "La rata copre solo gli interessi" : `Chiuso a ${meseFra(n)}`;
    restano = chiuso ? "Pagato tutto" : `Restano ${fmt(x.saldo)}`;
    barra = chiuso ? 100 : ini > 0 ? (1 - x.saldo / ini) * 100 : 0;
  }
  const dettaglio = x.aRate && !chiuso && x.intRata != null ? `<p class="small" style="margin:8px 0 0">Di questa rata: circa <b>${fmt(x.intRata)}</b> di interessi e <b>${fmt(x.R - x.intRata)}</b> di capitale. Interessi ancora da pagare: circa ${fmt(x.intTot)}.</p>`
    : x.aRate && !chiuso && !x.senzaFine ? `<p class="small" style="margin:8px 0 0">Aggiungi il debito residuo per vedere quanto paghi di interessi.</p>` : "";
  return `<button class="card" data-deb="${d.id}" style="display:block;width:100%;${evidenzia ? "box-shadow:0 0 0 3px var(--lv), var(--shadow);" : ""}text-align:left;padding:16px 18px;margin:12px 0">

  ${deb.length ? `<p class="small" style="margin:-4px 0 10px">Nell'ordine consigliato: prima i più cari, il mutuo per ultimo.</p>` : ""}

    <div class="row" style="align-items:baseline"><span class="mid">${fmt(fs)}</span><span class="small">obiettivo ${fs < f1 ? "1 mese" : mesiTarget() + " mesi"}: ${fmt(target)}</span></div>

  ${lv >= 5 ? `<h2 class="s">Grandi obiettivi <button class="mini" data-a="addGrande">+ Nuovo</button></h2>${S.obiettivi.filter(o => o.grande).map(o => objCard(o, avz, cari)).join("") || `<div class="card small">Casa, anticipo, cifre importanti: qui vedi quanti anni servono, con le tappe da festeggiare.</div>`}`
    : `<div class="card row" style="gap:14px;background:rgba(255,255,255,.72);border:2.5px dashed #B5A99B;box-shadow:none">${ico("lock", "var(--text2)").replace("<svg", '<svg width="26" height="26" style="flex:none"')}<div class="col"><b style="color:var(--text)">Grandi obiettivi</b><span class="small">Casa, anticipo, cifre importanti. Si sbloccano al livello 5 · Fondo pieno.</span></div></div>`}

  ${fatte.length ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer;min-height:44px;display:flex;align-items:center">Fatte (${fatte.length})</summary><div class="list" style="margin-top:6px">${fatte.map(scadRow).join("")}</div></details>` : ""}
  <button class="btn ghost" data-a="calendario">${ico("cal").replace("<svg", '<svg width="20" height="20"')} Aggiungi al calendario</button>

function objCard(o, avz, cari) {
  const pc = o.target > 0 ? clamp(o.saldo / o.target * 100, 0, 100) : 0;
  const quota = Math.round(avz * (cari ? .10 : .40)), dopo = Math.round(avz * .40);
  let extra;
  if (o.grande) {
    const m = quota > 0 ? Math.ceil((o.target - o.saldo) / quota) : null;
    extra = m ? `Con ${fmt(quota)} al mese ci arrivi in circa ${m >= 24 ? Math.round(m / 12) + " anni" : m + " mesi"}. Per obiettivi così lunghi informati su come far crescere i risparmi, anche con un consulente indipendente.` : "Quando avanza qualcosa ogni mese, ti diciamo in quanto tempo ci arrivi.";
    const tappe = [10, 25, 50, 75].filter(t => pc >= t); if (tappe.length) extra += ` Tappa raggiunta: ${tappe.pop()}%!`;
  } else extra = o.saldo >= o.target ? "Obiettivo raggiunto!" : cari ? `${fmt(quota)} al mese adesso, ${fmt(dopo)} quando chiudi i debiti cari.` : `Suggerito: circa ${fmt(quota)} al mese.`;
  return `<button class="card" data-obj="${o.id}" style="display:block;width:100%;text-align:left">
    <div class="row" style="font-weight:800;font-size:16px"><span>${esc(o.nome)}</span><span>${fmt(o.saldo)} su ${fmt(o.target)}</span></div>
    <div class="bar thin" style="margin:10px 0"><i style="width:${pc}%;background:#5BC98C"></i></div>
    <span class="small">${extra}</span></button>`;
}

function scadRow(s) {
  const d = s.data ? parse(s.data) : null, late = d && !s.fatto && d < today();
  return `<label class="item" style="cursor:pointer"><input type="checkbox" data-scad="${s.id}" ${s.fatto ? "checked" : ""} style="width:24px;height:24px;accent-color:var(--ink);flex:none" aria-label="Fatto">
    <div style="width:50px;flex:none;display:flex;flex-direction:column;align-items:center;background:${late ? "var(--warnbg)" : "var(--soft)"};border-radius:14px;padding:5px 0">

}

/* ---------- 3. TRAGUARDI: SENTIERO A ZIG-ZAG CON TAPPE TONDE ---------- */
function vTraguardi() {
  const cur = S.livello.max, n = Object.keys(S.medaglie).length;
  const N = LEVELS.length;
  const pts = LEVELS.map((_, i) => [i % 2 === 0 ? 48 : 272, 42 + i * 94]);
  let pathD = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    const cy = (y1 + y2) / 2;
    pathD += ` C ${x1} ${cy}, ${x2} ${cy}, ${x2} ${y2}`;
  }
  const vh = 42 + (N - 1) * 94 + 42;

  return `
  <h1 class="t">Traguardi</h1><p class="sub">Il tuo Cipignolo sale il sentiero e cambia colore.</p>
  <div class="trail">
    <svg class="trail-svg" viewBox="0 0 320 ${vh}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${pathD}" fill="none" stroke="#D8CEC0" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
    </svg>
    <div class="trail-nodes">
    ${LEVELS.map((L, i) => {
      const side = i % 2 === 0 ? "left" : "right";
      const locked = i > cur + 1;
      const status = i < cur
        ? ico("traguardi", L.ink).replace("<svg", '<svg width="24" height="24" role="img" aria-label="Trofeo"').replace('aria-hidden="true"', "")
        : i === cur
        ? `<span class="tag" style="background:${L.lv}">Sei qui</span>`
        : i === cur + 1
        ? `<span class="tag" style="background:var(--soft);color:var(--ink)">${Math.round(progresso(i).p)}%</span>`
        : ico("lock", "#6E6259").replace("<svg", '<svg width="20" height="20"');
      return `<div class="tnode ${side} ${i === cur ? "here" : ""}">
        <div class="tbadge-wrap">
          ${i === cur ? `<div class="tpiggy">${piggy(L.piggy, L.ghost, 56, "happy")}</div>` : ""}
          <div class="tbadge ${L.ghost ? "ghost" : ""} ${locked ? "locked" : ""}" style="background:${locked ? "#EAE1D4" : L.lv}">
            <span>${i}</span>
            ${i < cur ? '<span class="tsub">✓</span>' : ""}
          </div>
        </div>
        <div class="tinfo">
          <div class="row" style="width:100%;gap:6px"><b>${L.n}</b>${status}</div>
          <span class="small">${i <= cur && S.livello.date[i] ? `Raggiunto il ${parse(S.livello.date[i]).toLocaleDateString("it-IT")}` : L.d}</span>
        </div>
      </div>`;
    }).join("")}
    </div>
  </div>
  <h2 class="s">Medaglie <span class="small" style="color:var(--ink);font-size:15px">${n} su ${MEDALS.length}</span></h2>
  <div class="medals">${MEDALS.map(m => { const on = !!S.medaglie[m.id]; return `<button class="medal ${on ? "" : "off"}" data-medal="${m.id}">${medalSvg(on, m.n + (on ? ", ottenuta" : ", da sbloccare"))}<b>${m.n}</b></button>`; }).join("")}</div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-a],[data-q],[data-edit],[data-deb],[data-obj],[data-delscad],[data-medal],[data-voce],[data-addvoce],[data-chiat],[data-filtro]");
  if (!t || !S.setup) return;
  if (t.closest("#bd") && !t.dataset.a) return;
  if (t.dataset.tab) { VIEW = t.dataset.tab; WEEK = 0; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.q) return tapRapido(t.dataset.q);
  if (t.dataset.edit) return editSpesa(t.dataset.edit);
  if (t.dataset.deb) return editDebito(t.dataset.deb);
  if (t.dataset.obj) return editObiettivo(t.dataset.obj);
  if (t.dataset.chiat) { S.chiAttivo = t.dataset.chiat; save(); render(); return; }
  if (t.dataset.filtro) { FILTRO = t.dataset.filtro; render(); return; }
  if (t.dataset.voce) { const [k, id] = t.dataset.voce.split("|"); return editVoce(k, id); }

  if (t.dataset.medal) { const m = MEDALS.find(x => x.id === t.dataset.medal); return toast(`${m.n}: ${m.d}${S.medaglie[m.id] ? " · ottenuta il " + parse(S.medaglie[m.id]).toLocaleDateString("it-IT") : ""}`); }
  if (t.dataset.delscad) { e.preventDefault(); const s = S.scadenze.find(x => x.id === t.dataset.delscad); const i = S.scadenze.indexOf(s); S.scadenze.splice(i, 1); return commit("Scadenza eliminata", () => { S.scadenze.splice(i, 0, s); commit(); }); }
  const a = t.dataset.a;
  const A = { ai, settings, addSpesa:() => editSpesa(null), addExtra, addDebito:() => editDebito(null), fondo:editFondo, addObiettivo:() => editObiettivo(null), addGrande:() => editObiettivo(null, true), addScad, calendario, consigli:allConsigli,
    wprev:() => { WEEK--; render(); }, wnext:() => { if (WEEK < 0) { WEEK++; render(); } } };
  A[a] && A[a]();
});
document.addEventListener("change", e => {

function tapRapido(id) {

function bindChi(b, init, attr = "data-chi") {

}

function editVoce(kind, id, nomePre) {

function setFondo(v) {

  const m = meseCorrente(), sp = speseIn(m.a, m.b);
  if (sp.length) { const by = {}; sp.forEach(s => by[s.cat] = (by[s.cat] || 0) + s.importo); lines.push(`- Spese variabili di questo mese: ${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${c} ${fmt(v)}`).join(", ")}`); }

/* ---------- Calendario (.ics) ---------- */
function calendario() {
  const now = today();
  const d8 = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ev = (uidS, start, ora, rrule, title, desc) => ["BEGIN:VEVENT", `UID:${uidS}@cipignolo`, `DTSTAMP:${stamp}`, `DTSTART:${d8(start)}T${ora}`, "DURATION:PT10M", `RRULE:${rrule}`, `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"];
  const paga = (g, who, k) => { g = clamp(+g || 23, 1, 28); let p = new Date(now.getFullYear(), now.getMonth(), g); if (p < now) p = new Date(now.getFullYear(), now.getMonth() + 1, g);
    return ev("paga" + k, p, "090000", `FREQ=MONTHLY;BYMONTHDAY=${g}`, `Cipignolo: giorno di paga${who}`, "Il rito dei 5 minuti: apri Cipignolo e sistema il mese."); };
  const sun = addDays(now, (7 - now.getDay()) % 7);
  const ev2 = [];
  if (S.entrate.tipo === "fisso") {
    ev2.push(...paga(S.entrate.giorno, coppia() ? ` (${S.nick.p1})` : "", 1));
    if (coppia() && +S.entrate.importo2 > 0) ev2.push(...paga(S.entrate.giorno2, ` (${S.nick.p2})`, 2));
  }
  ev2.push(...ev("domenica", sun, "180000", "FREQ=WEEKLY;BYDAY=SU", "Cipignolo: check della domenica", "5 minuti per vedere come è andata la settimana."));
  voci().forEach(v => { const p = prossima(v); if (!p) return; const f = Math.max(1, +v.freq || 1);
    ev2.push(...ev("v" + v.id, p, "090000", `FREQ=MONTHLY;INTERVAL=${f}`, v.k === "abb" ? `Cipignolo: rinnovo ${v.nome} (${fmt2(v.importo)})` : `Cipignolo: ${v.nome} (circa ${fmt(v.importo)})`, v.k === "abb" ? "Si rinnova oggi: lo usi ancora?" : "Scadenza di casa. Se l'importo è cambiato, aggiornalo in Cipignolo.")); });
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Cipignolo//IT", "CALSCALE:GREGORIAN", ...ev2, "END:VCALENDAR"];
  download(new Blob([lines.join("\r\n")], { type:"text/calendar" }), "cipignolo-promemoria.ics");
  toast("Apri il file per aggiungere i promemoria al calendario");
}
async function download(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

}

    $("#save", b).onclick = () => {

      S.nick = { p1: $("#k1", b).value.trim() || S.nick.p1 || "Persona 1", p2: $("#k2", b).value.trim() || S.nick.p2 || "Persona 2" };
      S.entrate = { tipo, importo:num($("#s1", b).value), importo2:num($("#s2", b).value), giorno:clamp(parseInt($("#sg", b).value, 10) || 23, 1, 31), giorno2:clamp(parseInt($("#sg2", b).value, 10) || 23, 1, 31) };
      const bud = num($("#sb", b).value); S.budgetMensile = bud > 0 ? bud : null;
      S.budgetPers = { p1: num($("#bp1", b).value) || null, p2: num($("#bp2", b).value) || null };
      S.rapidi = [...b.querySelectorAll("#rq .fxr")].map(r => { const base = JSON.parse(r.dataset.r); const p = numOrNull($(".v", r).value); return { ...base, prezzo: base.tipo === "libero" ? null : p }; });
      if (!coppia()) FILTRO = "tutti";
      closeSheet(); commit("Impostazioni salvate"); };
    $("#exp", b).onclick = esporta; $("#imp", b).onclick = importa;
    $("#reset", b).onclick = () => sheet(`<h3>Sicuro?</h3><p class="sub">Cancelli tutti i dati da questo telefono. Se non hai un backup, non si possono recuperare.</p><button class="btn danger" id="yes">Sì, cancella tutto</button><button class="btn ghost" id="no">No, torna indietro</button>`, c => {
      $("#yes", c).onclick = () => { localStorage.removeItem(KEY); S = blank(); closeSheet(true); OB = null; render(); };
      $("#no", c).onclick = () => { closeSheet(); setTimeout(settings, 220); };
    });
  });
}
const rqRow = r => `<div class="fxr row" data-r='${esc(JSON.stringify(r))}' style="gap:8px;margin-bottom:8px"><span style="flex:1;font-weight:800">${esc(r.nome)}</span>${r.tipo === "libero" ? '<span class="small" style="width:96px;text-align:center">a importo</span><input class="v hidden">' : `<input class="in v" aria-label="Prezzo ${esc(r.nome)}" inputmode="decimal" value="${r.prezzo != null ? String(r.prezzo).replace(".", ",") : ""}" placeholder="€" style="width:96px">`}<button class="ibtn" data-rm aria-label="Rimuovi ${esc(r.nome)}" style="box-shadow:none;background:var(--soft)">${xIco()}</button></div>`;

/* ---------- avvio ---------- */
if (S.setup) check(true);
render();
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.setup) { check(); render(); } });
})();
</script>
</body>
</html>
